<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ayuq na mag-aral hohuhuo — Midterm Review</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F6FD;
  --card:#FFFFFF;
  --ink:#1B2140;
  --muted:#6B7280;
  --line:#E7ECF7;
  --blue1:#3E6BFF;
  --blue2:#6C4DF0;
  --blue-soft:#EEF2FF;
  --green:#12B981;
  --red:#EF4444;
  --amber:#F59E0B;
  --radius:20px;
  --shadow:0 10px 30px -12px rgba(37,52,110,.18);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Inter',sans-serif;
  background:var(--bg);
  color:var(--ink);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:'Poppins',sans-serif; margin:0;}
.wrap{max-width:1080px;margin:0 auto;padding:22px 20px 60px;}
.topbar{
  display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;
}
.brand{display:flex;align-items:center;gap:10px;font-family:'Poppins';font-weight:700;font-size:19px;}
.brand .dot{width:10px;height:10px;border-radius:50%;background:linear-gradient(135deg,var(--blue1),var(--blue2));}
.pill{
  background:var(--card);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:13px;color:var(--muted);
  display:flex;align-items:center;gap:6px;
}
/* HERO */
.hero{
  background:linear-gradient(120deg,#3552F0 0%,#6C4DF0 55%,#8B5CF6 100%);
  border-radius:28px;
  padding:38px 34px;
  color:#fff;
  position:relative;
  overflow:hidden;
  box-shadow:var(--shadow);
  margin-bottom:26px;
}
.hero::after{
  content:"";position:absolute;right:-60px;top:-60px;width:260px;height:260px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.18),transparent 70%);
}
.hero::before{
  content:"";position:absolute;left:-40px;bottom:-80px;width:220px;height:220px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.12),transparent 70%);
}
.hero h1{font-size:30px;line-height:1.25;position:relative;z-index:1;}
.hero p{opacity:.92;margin-top:8px;font-size:15px;max-width:520px;position:relative;z-index:1;}
.hero-stats{display:flex;gap:26px;margin-top:22px;position:relative;z-index:1;flex-wrap:wrap;}
.hero-stats div{font-family:'Poppins';font-weight:700;font-size:22px;}
.hero-stats span{display:block;font-family:'Inter';font-weight:400;font-size:12px;opacity:.85;}

/* SUBJECT GRID */
.section-title{font-size:15px;color:var(--muted);font-weight:600;margin:26px 2px 12px;text-transform:uppercase;letter-spacing:.06em;}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px;}
.card{
  background:var(--card);border-radius:var(--radius);padding:20px;cursor:pointer;
  border:1px solid var(--line); transition:transform .15s ease, box-shadow .15s ease;
  position:relative; overflow:hidden;
}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow);}
.card .icon{
  width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;
  font-size:24px;margin-bottom:14px;
}
.card h3{font-size:17px;margin-bottom:6px;}
.card .meta{font-size:12.5px;color:var(--muted);line-height:1.5;}
.card .badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px;}
.badge{font-size:11px;font-weight:600;padding:4px 9px;border-radius:999px;background:var(--blue-soft);color:var(--blue1);}
.progress-track{height:5px;background:var(--line);border-radius:99px;margin-top:14px;overflow:hidden;}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--blue1),var(--blue2));width:0%;transition:width .4s;}

/* SUBJECT VIEW */
.back-btn{
  display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);
  padding:9px 16px;border-radius:999px;font-size:13.5px;font-weight:600;cursor:pointer;color:var(--ink);margin-bottom:18px;
}
.back-btn:hover{border-color:var(--blue1);color:var(--blue1);}
.subject-head{display:flex;align-items:center;gap:16px;margin-bottom:18px;}
.subject-head .icon{width:56px;height:56px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:28px;flex-shrink:0;}
.subject-head h2{font-size:23px;}
.subject-head .sub{color:var(--muted);font-size:13.5px;margin-top:4px;}

.tabs{display:flex;gap:8px;margin-bottom:22px;flex-wrap:wrap;}
.tab{
  padding:10px 18px;border-radius:999px;background:var(--card);border:1px solid var(--line);
  font-weight:600;font-size:13.5px;cursor:pointer;color:var(--muted);
}
.tab.active{background:var(--ink);color:#fff;border-color:var(--ink);}
.lesson-tabs{margin-bottom:20px;}
.lesson-pill{font-size:12.5px;padding:8px 14px;}

.panel{background:var(--card);border-radius:var(--radius);padding:26px;border:1px solid var(--line);}

/* NOTES */
.note-block{margin-bottom:22px;}
.note-block:last-child{margin-bottom:0;}
.note-block h4{font-size:15.5px;margin-bottom:10px;display:flex;align-items:center;gap:8px;}
.note-block h4::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--blue1);flex-shrink:0;}
.note-block ul{margin:0;padding-left:20px;}
.note-block li{font-size:14px;line-height:1.65;color:#333a52;margin-bottom:7px;}
.essay-box{background:var(--blue-soft);border-radius:14px;padding:16px 18px;margin-top:18px;}
.essay-box h4{margin-bottom:10px;font-size:14.5px;}
.essay-box ol{margin:0;padding-left:20px;}
.essay-box li{font-size:13.5px;line-height:1.6;margin-bottom:8px;color:#333a52;}

/* FLASHCARDS */
.flash-wrap{display:flex;flex-direction:column;align-items:center;gap:18px;}
.flash-counter{font-size:13px;color:var(--muted);font-weight:600;}
.flashcard{
  width:100%;max-width:460px;height:230px;perspective:1400px;cursor:pointer;
}
.flashcard-inner{
  position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d;
}
.flashcard.flipped .flashcard-inner{transform:rotateY(180deg);}
.flashcard-face{
  position:absolute;inset:0;backface-visibility:hidden;border-radius:18px;
  display:flex;align-items:center;justify-content:center;text-align:center;padding:26px;
  line-height:1.5;
  box-shadow:var(--shadow);
  overflow-y:auto;
}
.flashcard-face.front{background:linear-gradient(135deg,var(--blue1),var(--blue2));color:#fff;font-family:'Inter';font-weight:500;font-size:15.5px;}
.flashcard-face.back{background:var(--card);color:var(--ink);transform:rotateY(180deg);border:1px solid var(--line);font-family:'Poppins';font-weight:700;font-size:20px;}
.flash-nav{display:flex;gap:10px;}
.nav-btn{
  padding:10px 20px;border-radius:12px;border:none;background:var(--ink);color:#fff;font-weight:600;cursor:pointer;font-size:13.5px;
}
.nav-btn.secondary{background:var(--card);color:var(--ink);border:1px solid var(--line);}
.nav-btn:disabled{opacity:.4;cursor:default;}

/* QUIZ */
.quiz-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;flex-wrap:wrap;gap:10px;}
.quiz-bar{flex:1;height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:0 16px;}
.quiz-bar-fill{height:100%;background:linear-gradient(90deg,var(--blue1),var(--blue2));width:0%;transition:width .3s;}
.q-count{font-size:13px;color:var(--muted);font-weight:600;white-space:nowrap;}
.q-type{display:inline-block;font-size:11px;font-weight:700;color:var(--blue1);background:var(--blue-soft);padding:4px 10px;border-radius:999px;margin-bottom:12px;text-transform:uppercase;letter-spacing:.03em;}
.q-text{font-family:'Poppins';font-size:18px;font-weight:600;margin-bottom:20px;line-height:1.45;}
.options{display:flex;flex-direction:column;gap:10px;}
.option{
  text-align:left;padding:14px 16px;border-radius:14px;border:1.5px solid var(--line);background:#fff;
  font-size:14.5px;cursor:pointer;transition:.15s;display:flex;gap:10px;align-items:flex-start;
}
.option:hover{border-color:var(--blue1);}
.option .letter{
  width:24px;height:24px;border-radius:7px;background:var(--blue-soft);color:var(--blue1);font-weight:700;font-size:12.5px;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.option.correct{border-color:var(--green);background:#ECFDF5;}
.option.correct .letter{background:var(--green);color:#fff;}
.option.wrong{border-color:var(--red);background:#FEF2F2;}
.option.wrong .letter{background:var(--red);color:#fff;}
.option.disabled{cursor:default;}
.quiz-actions{display:flex;justify-content:flex-end;margin-top:22px;}
.result-wrap{text-align:center;padding:20px 10px;}
.result-score{font-family:'Poppins';font-weight:800;font-size:52px;background:linear-gradient(135deg,var(--blue1),var(--blue2));-webkit-background-clip:text;background-clip:text;color:transparent;}
.result-label{color:var(--muted);font-size:14px;margin-top:4px;}
.result-msg{font-size:15px;margin-top:16px;color:var(--ink);font-weight:600;}
.review-list{margin-top:28px;text-align:left;}
.review-item{padding:14px 16px;border-radius:14px;border:1px solid var(--line);margin-bottom:10px;font-size:13.5px;}
.review-item .rq{font-weight:600;margin-bottom:6px;}
.review-item.ok{border-left:4px solid var(--green);}
.review-item.bad{border-left:4px solid var(--red);}
.review-item .ra{color:var(--muted);}
.review-item .ra b{color:var(--green);}
.start-box{text-align:center;padding:30px 10px;}
.start-box p{color:var(--muted);font-size:14px;max-width:420px;margin:10px auto 22px;}
.big-btn{
  background:linear-gradient(135deg,var(--blue1),var(--blue2));color:#fff;border:none;padding:14px 30px;
  border-radius:14px;font-weight:700;font-size:14.5px;cursor:pointer;font-family:'Poppins';
}
.big-btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line);}
.btn-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}

.empty-hint{color:var(--muted);font-size:13.5px;text-align:center;padding:40px 0;}
footer{text-align:center;color:var(--muted);font-size:12.5px;margin-top:36px;}
@media (max-width:600px){
  .hero h1{font-size:23px;}
  .hero{padding:26px 22px;}
  .panel{padding:18px;}
  .q-text{font-size:16px;}
}
</style>
</head>
