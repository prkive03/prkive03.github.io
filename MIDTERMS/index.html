<script id="subject-data" type="application/json">{"uts": {"name": "Understanding the Self","icon": "🪞","color": "#5B6EF5","examType": "Multiple Choice","coverage": "Lessons 1–7 (Philosophical, Sociological, Cultural, Psychological, Physical, Sexual & Political Self)","exam": [{"q": "Which philosopher said, \"The only true wisdom is in knowing you know nothing\"?","opts": ["Socrates","Plato","Aristotle","Descartes"],"a": 0,"k": "Multiple Choice"},{"q": "In Plato's Tripartite Soul, which part desires bodily pleasures such as food, drink, and sex?","opts": ["Rational part","Spirited part","Appetite part","Reasoning part"],"a": 2,"k": "Multiple Choice"},{"q": "In Plato's Tripartite Soul, the Spirited part corresponds to which class?","opts": ["Ruling Class","Military Class","Commoner Class","Merchant Class"],"a": 1,"k": "Multiple Choice"},{"q": "Which philosopher believed happiness, dependent on one's virtues, is the central purpose of human life?","opts": ["Aristotle","Augustine","Hume","Locke"],"a": 0,"k": "Multiple Choice"},{"q": "\"I doubt therefore I think, I think therefore I am\" is attributed to:","opts": ["John Locke","Rene Descartes","David Hume","Immanuel Kant"],"a": 1,"k": "Multiple Choice"},{"q": "According to Descartes, the self is defined as:","opts": ["A bundle of impressions","A subject that thinks","A blank slate","A social emergent"],"a": 1,"k": "Multiple Choice"},{"q": "John Locke believed personal identity is founded on:","opts": ["Consciousness","The physical body","Reason alone","Culture"],"a": 0,"k": "Multiple Choice"},{"q": "Which philosopher described the mind at birth as a \"tabula rasa\" (blank slate)?","opts": ["Locke","Hume","Kant","Freud"],"a": 0,"k": "Multiple Choice"},{"q": "David Hume argued that the self is:","opts": ["A permanent soul","A bundle of impressions","Divided into internal and external selves","Composed of id, ego, and superego"],"a": 1,"k": "Multiple Choice"},{"q": "According to Hume, over time, persons that continue to exist:","opts": ["Are fixed by memory","Do not really exist, only impressions do","Are guaranteed by God","Are socially constructed"],"a": 1,"k": "Multiple Choice"},{"q": "Kant divided consciousness into which two parts?","opts": ["Id and ego","Internal self and external self","True self and false self","I-self and Me-self"],"a": 1,"k": "Multiple Choice"},{"q": "In Freud's structure of the self, which part operates on the pleasure principle?","opts": ["Id","Ego","Superego","Persona"],"a": 0,"k": "Multiple Choice"},{"q": "Which part of Freud's structure of the self operates on the morality principle?","opts": ["Id","Ego","Superego","Self"],"a": 2,"k": "Multiple Choice"},{"q": "Gilbert Ryle believed the self is best understood through:","opts": ["Introspection alone","Observable actions and behavior","Dreams","Spiritual reflection"],"a": 1,"k": "Multiple Choice"},{"q": "Maurice Merleau-Ponty compared the body to:","opts": ["A machine","A physical object","A work of art","An empty vessel"],"a": 2,"k": "Multiple Choice"},{"q": "George Herbert Mead argued that the mind and self arise out of:","opts": ["Genetics","The social act of communication","Religious practice","Isolation"],"a": 1,"k": "Multiple Choice"},{"q": "In Mead's theory, which activity requires an individual to internalize the roles of all others and comprehend the rules involved?","opts": ["Language","Play","Game","Ritual"],"a": 2,"k": "Multiple Choice"},{"q": "In Mead's \"I\" and \"Me\" self, which represents the expectations and attitudes of others?","opts": ["I","Me","Ego","Persona"],"a": 1,"k": "Multiple Choice"},{"q": "Which self, according to Mead, allows a person to express individuality and creativity?","opts": ["I","Me","Superego","Persona"],"a": 0,"k": "Multiple Choice"},{"q": "A society where the self is viewed as dependent on the situation or social setting is called:","opts": ["Egocentric","Sociocentric","Individualistic","Autonomous"],"a": 1,"k": "Multiple Choice"},{"q": "An egocentric view of the self occurs when a person:","opts": ["Prioritizes group needs over their own","Cannot understand or assume any perspective other than their own","Values interdependence","Avoids conflict"],"a": 1,"k": "Multiple Choice"},{"q": "In Van Gennep's Rites of Passage, the phase where an individual has left their old status but not yet entered the new one is called:","opts": ["Separation Phase","Liminality Phase","Incorporation Phase","Transition Phase"],"a": 1,"k": "Multiple Choice"},{"q": "Which component of culture refers to tangible materials inherited from a previous generation?","opts": ["Material Component","Cognitive Component","Normative Component","Symbolic Component"],"a": 0,"k": "Multiple Choice"},{"q": "Which of the following is NOT one of the characteristics of culture discussed in the notes?","opts": ["Culture is learned","Culture is shared","Culture is biological and inherited","Culture is based on symbols"],"a": 2,"k": "Multiple Choice"},{"q": "The tendency to value other cultures more highly than one's own is called:","opts": ["Xenophobia","Xenocentrism","Ethnocentrism","Cultural lag"],"a": 1,"k": "Multiple Choice"},{"q": "Fear and hatred of foreigners or anything strange or foreign is called:","opts": ["Xenocentrism","Culture shock","Xenophobia","Cultural borrowing"],"a": 2,"k": "Multiple Choice"},{"q": "According to Elizabeth Hurlock's Stages of Life Span, adolescence covers which age range?","opts": ["10 to 14 years old","14 to 18 years old","18 to 40 years old","6 to 10 years old"],"a": 1,"k": "Multiple Choice"},{"q": "According to the notes, the body generally performs its functions least well during:","opts": ["Early adulthood and middle age","Infancy and old age","Adolescence and puberty","Childhood and adolescence"],"a": 1,"k": "Multiple Choice"},{"q": "Which factor of physical growth and development argues that behavior traits can be explained by genetics?","opts": ["Nurture","Nature","Environment","Culture"],"a": 1,"k": "Multiple Choice"},{"q": "The sex chromosomes are also known as:","opts": ["Autosomes","Gonosomes","Genes","Alleles"],"a": 1,"k": "Multiple Choice"},{"q": "How many pairs of chromosomes do humans have according to the notes?","opts": ["22 pairs","23 pairs","24 pairs","46 pairs"],"a": 1,"k": "Multiple Choice"},{"q": "A person's overall evaluation of his or her own worth is called:","opts": ["Self-concept","Self-esteem","Body image","Appearance"],"a": 1,"k": "Multiple Choice"},{"q": "Which of the following is NOT listed in the notes as a cause of poor body image?","opts": ["Emphasis on the ideal body","Bullying and peer pressure","Media","Genetics"],"a": 3,"k": "Multiple Choice"},{"q": "Which disorders are linked in the notes to poor body image?","opts": ["Bulimia Nervosa and Anorexia Nervosa","ADHD and OCD","Bipolar Disorder","Schizophrenia"],"a": 0,"k": "Multiple Choice"},{"q": "\"Beauty in things exist merely in the mind which contemplates them\" is a quote from:","opts": ["Benjamin Franklin","David Hume","Aristotle","Socrates"],"a": 1,"k": "Multiple Choice"},{"q": "In Egyptian art, beauty was portrayed in women with:","opts": ["Full figures and rounded hips","Slim, high waist, narrow hips, and long black hair","Chubby bodies","Flat noses"],"a": 1,"k": "Multiple Choice"},{"q": "In women, hormone production follows a cyclical pattern of how many days?","opts": ["21 days","28 days","30 days","35 days"],"a": 1,"k": "Multiple Choice"},{"q": "PCOS (Polycystic Ovary Syndrome) is characterized by:","opts": ["Prolonged menstrual periods or excess male hormone levels","Low blood pressure","Thyroid deficiency","Vitamin deficiency"],"a": 0,"k": "Multiple Choice"},{"q": "According to Masters and Johnson, what is the correct order of the sexual response cycle?","opts": ["Desire, Excitement, Plateau, Orgasm, Resolution","Excitement, Desire, Plateau, Resolution, Orgasm","Plateau, Desire, Excitement, Orgasm, Resolution","Desire, Plateau, Excitement, Orgasm, Resolution"],"a": 0,"k": "Multiple Choice"},{"q": "The practice of engaging in sexual stimulation to the point of ejaculation before stopping and starting again is called:","opts": ["Plateau phase","Edging","Foreplay","Resolution"],"a": 1,"k": "Multiple Choice"},{"q": "A person who identifies with the gender they were assigned at birth is called:","opts": ["Transgender","Cisgender","Non-binary","Genderqueer"],"a": 1,"k": "Multiple Choice"},{"q": "According to the notes, Sexual Orientation answers which question?","opts": ["\"Who you are\"","\"Who you have a crush on\"","\"How you dress\"","\"What you believe\""],"a": 1,"k": "Multiple Choice"},{"q": "In Sternberg's Triangular Theory of Love, which type of love has intimacy and commitment but no passion?","opts": ["Romantic Love","Companionate Love","Fatuous Love","Infatuation"],"a": 1,"k": "Multiple Choice"},{"q": "Love with passion and commitment but no intimacy is called:","opts": ["Consummate Love","Fatuous Love","Empty Love","Liking"],"a": 1,"k": "Multiple Choice"},{"q": "Which modern love style sees love as a game and avoids being dependent on love?","opts": ["Storge","Ludus","Pragma","Agape"],"a": 1,"k": "Multiple Choice"},{"q": "The love style described as \"the Practicals,\" seeing love as a means to economic security, is:","opts": ["Eros","Mania","Pragma","Storge"],"a": 2,"k": "Multiple Choice"},{"q": "A love style marked by possessiveness, jealousy, and controlling behavior is:","opts": ["Eros","Mania","Agape","Storge"],"a": 1,"k": "Multiple Choice"},{"q": "Marrying within one's own group is called:","opts": ["Exogamy","Endogamy","Monogamy","Polygamy"],"a": 1,"k": "Multiple Choice"},{"q": "A residence pattern where a couple lives with the wife's family is called:","opts": ["Patrilocal","Matrilocal","Neolocal","Bilocal"],"a": 1,"k": "Multiple Choice"},{"q": "A man marrying two or more women is called:","opts": ["Polyandry","Polygyny","Monogamy","Endogamy"],"a": 1,"k": "Multiple Choice"},{"q": "Which STDs are classified in the notes as viral with no cure?","opts": ["Chlamydia and Gonorrhea","HPV, HIV, and Herpes","Syphilis and Chlamydia","Gonorrhea and HPV"],"a": 1,"k": "Multiple Choice"},{"q": "The most common bacterial STD, often affecting ages 15-24, is:","opts": ["Gonorrhea","Chlamydia","Syphilis","Herpes"],"a": 1,"k": "Multiple Choice"},{"q": "Power based on one's control over the distribution of rewards is called:","opts": ["Coercive Power","Reward Power","Legitimate Power","Referent Power"],"a": 1,"k": "Multiple Choice"},{"q": "Power based on identification with, attraction to, or respect for the power-holder is:","opts": ["Expert Power","Referent Power","Informational Power","Legitimate Power"],"a": 1,"k": "Multiple Choice"},{"q": "A leadership style with individual control over all decisions and little input from members is called:","opts": ["Democratic","Laissez-Faire","Autocratic","Transformational"],"a": 2,"k": "Multiple Choice"},{"q": "A leadership style that is hands-off and lets group members make decisions is called:","opts": ["Autocratic","Laissez-Faire","Transactional","Democratic"],"a": 1,"k": "Multiple Choice"},{"q": "The Door-in-the-Face Technique involves:","opts": ["A small request followed by a larger one","An outrageous initial offer designed to fail, followed by a more reasonable request","Threats to gain compliance","Rewards for compliance"],"a": 1,"k": "Multiple Choice"},{"q": "The Foot-in-the-Door Technique assumes that:","opts": ["Agreeing to a small request increases the likelihood of agreeing to a larger one","Refusing a request increases compliance","Rewards guarantee compliance","Punishment increases resistance"],"a": 0,"k": "Multiple Choice"},{"q": "According to Donald Winnicott, the function of the false self is to:","opts": ["Express creativity","Hide and protect the true self","Replace the ego","Gain social status"],"a": 1,"k": "Multiple Choice"},{"q": "Carl Rogers argued that psychological problems, stress, and anxiety arise when:","opts": ["The ideal self is too far removed from the real self","The id overpowers the ego","Culture conflicts with nature","Memory fails"],"a": 0,"k": "Multiple Choice"}],"flash": [["Tripartite Soul","Plato's theory that the soul has 3 parts: Rational (ruling class), Spirited (military class), and Appetite (commoners)."],["Cogito, ergo sum","Descartes' famous line \"I think, therefore I am\" — the self is a thinking subject."],["Tabula Rasa","John Locke's idea that the mind is a blank slate shaped by experience."],["Bundle of impressions","David Hume's view that the self is just a collection of impressions, not a permanent identity."],["Id, Ego, Superego","Freud's three parts of personality: Id (pleasure), Ego (reality), Superego (morality)."],["I-self vs Me-self (Mead)","\"I\" is individuality/creativity; \"Me\" is the internalized attitudes of others."],["Sociocentric self","Self viewed as dependent on the social group or setting; group needs come first."],["Egocentric self","Self viewed as autonomous; unable to take another's perspective."],["Xenocentrism","Valuing other cultures more than one's own."],["Xenophobia","Fear and hatred of foreigners or anything foreign."],["True Self vs False Self (Winnicott)","True self is authentic and vulnerable; false self hides and protects it."],["Carl Rogers' Incongruence","Stress when the ideal self is too far removed from the real self."],["Triangular Theory of Love","Sternberg's theory: Passion, Intimacy, and Commitment combine into 8 types of love."],["Consummate Love","The ideal type of love — passion, intimacy, and commitment all present."],["Endogamy vs Exogamy","Endogamy = marrying within one's group; Exogamy = marrying outside one's group."],["Polygyny vs Polyandry","Polygyny = man with multiple wives; Polyandry = woman with multiple husbands."],["Reward vs Coercive Power","Reward power = control over rewards; Coercive power = ability to punish."],["Referent Power","Power based on admiration, charisma, or identification with the leader."],["Foot-in-the-Door","Small request first, to make a person agree to a bigger request later."],["Door-in-the-Face","An outrageous first request (meant to be refused) followed by the real, smaller request."]],"notes": [{"t": "Lesson 1: Philosophical Views of the Self","items": ["Socrates taught \"Know thyself,\" believing that the only true wisdom lies in admitting how little we know. He held that the pursuit of goodness, not wealth or pleasure, is what brings genuine happiness, and he used the Socratic Method — a back-and-forth of probing questions and answers — to help people examine their own beliefs.","Plato's Tripartite Soul divides the self into three parts that mirror the ideal society: the Rational part (associated with the ruling class) seeks truth and wisdom, the Spirited part (the military class) drives courage and honor, and the Appetite part (commoners) desires bodily pleasures like food, drink, and sex. Plato also believed the soul is omniscient before birth and that true knowledge is not learned but \"remembered\" through contemplation.","Aristotle argued that happiness (eudaimonia) is the ultimate purpose of life and that it depends on living virtuously. Unlike Plato, he believed the best way to understand the self and the world was through natural philosophy — what we would now call empirical, scientific observation.","St. Augustine merged Greek philosophical wisdom with Christian divine truth, teaching that the path to happiness is loving and knowing God. For Augustine, loving God is inseparable from loving one's fellow human beings.","René Descartes famously declared \"Cogito, ergo sum\" — \"I think, therefore I am.\" He argued that the self is fundamentally a thinking thing (a thinking subject) whose existence does not depend on tradition, authority, or even the physical body, since the very act of doubting proves that a thinking self exists.","John Locke proposed that personal identity is grounded not in the body or the soul, but in consciousness and memory — we remain the same person for as long as we can remember our past experiences. He also described the mind at birth as a tabula rasa, or blank slate, which is gradually filled in and shaped entirely by experience.","David Hume rejected the idea of a fixed, permanent self, describing it instead as merely a \"bundle of impressions\" — a rapidly changing collection of perceptions with no unifying essence. For Hume, there is no continuous person underneath these impressions; only the impressions themselves are real, so the sense of a lasting identity over time is something of an illusion.","Immanuel Kant divided consciousness into two components that work together to construct our sense of self: the Internal Self, made up of psychological states such as memory and emotion, and the External Self, made up of our experience of the physical world and objects around us.","Sigmund Freud believed personality is largely formed in early childhood and is shaped mostly by unconscious forces. He divided the psyche into three parts: the Id, which operates on the pleasure principle and seeks immediate gratification; the Ego, which operates on the reality principle and mediates between desires and the real world; and the Superego, which operates on the morality principle and represents internalized rules and conscience.","Gilbert Ryle argued against searching for some hidden, inner \"ghost in the machine.\" Instead, he claimed the self is best understood by looking at a person's observable behavior — in his words, you understand who someone is by \"looking at the way they act,\" not by looking for some separate mental entity.","Maurice Merleau-Ponty compared the human body to a work of art, arguing that we do not simply possess a body the way we possess an object — we live through it. Our perception of ourselves, he argued, is inseparable from and shaped by our perception of the outside world, since the body is our very means of engaging with that world."]},{"t": "Lesson 2: Sociological Views of the Self","items": ["One sociological view holds that the self is a product of modern society. As societies modernize, individuals are freed from the fixed roles of traditional communities, producing what is called a \"delocalized\" self — a self no longer tied down to one place or role, and therefore free to search for and construct its own identity.","The \"Self as Necessary Fiction\" perspective treats the self as a persona, borrowing from the Greek term for an actor's mask. On this view, the self we present is essentially a figment made up of the various roles we imagine and perform for others, rather than a single fixed reality.","The Post-Modern View treats the self as a kind of narrative or text that can be endlessly rewritten and reinterpreted. In the digital age, this self becomes further digitalized in cyberspace, giving rise to what theorists call \"pluralized selves\" — many different versions of one's identity existing across different platforms and contexts.","The \"Self as Artistic Creation\" perspective argues that the self is made rather than simply discovered. Much like a work of art, our identity emerges through the socialization process as a series of free choices we make about who we want to be.","George Herbert Mead's theory of the Social Self holds that the self develops gradually through three stages: Language (learning to use significant symbols), Play (imitating and taking on the role of one specific other person), and Game (learning to internalize the rules and perspectives of many others at once, as in a team sport).","Mead further distinguished between the \"I\" and the \"Me\" as two sides of the social self. The \"I\" represents a person's spontaneous individuality and creativity — the active, responding side of the self — while the \"Me\" represents the internalized attitudes and expectations of other people, essentially how we imagine society sees us."]},{"t": "Lesson 3: The Self Embedded in Culture","items": ["Anthropology examines the self by looking at how both cultural processes (learned customs, values, and beliefs) and biological processes (our shared human nature) work together — the classic nature-versus-nurture question — to shape who a person becomes.","A sociocentric self is one whose identity is understood as dependent on the surrounding social setting; for people with this orientation, the needs of the group are generally placed ahead of individual needs.","An egocentric self, by contrast, is viewed as autonomous and distinct from others. A defining feature of an egocentric orientation is difficulty assuming or fully understanding another person's perspective.","Arnold van Gennep described Rites of Passage as unfolding in three stages: Separation, where the individual leaves behind their old status or role; Liminality, an in-between, transitional phase where the person belongs to neither the old nor the new status; and Incorporation, where the individual is formally welcomed into their new role or status.","Culture is commonly analyzed as having three components: the Material Component, consisting of tangible objects inherited from earlier generations; the Cognitive Component, consisting of shared knowledge and skills; and the Normative Component, consisting of the standards and rules that govern behavior.","Culture has several defining characteristics: it is learned rather than inherited biologically, it is shared among members of a group, it relies on shared symbols to carry meaning, and it is dynamic and integrated, meaning its different parts are interconnected and it continues to change over time.","Cultural Lag refers to the gap in time between when a new cultural item — often a piece of technology — is introduced and when it becomes broadly accepted by society. Related to this is Cultural Borrowing, the practice of adopting elements from another culture, which can sometimes tip over into Xenocentrism, an excessive preference for foreign culture over one's own.","Xenophobia is the fear and hatred of foreigners or anything perceived as foreign or strange. Culture Shock, meanwhile, is the anxiety and disorientation a person feels when suddenly cut off from the familiar cues, symbols, and routines of their own culture."]},{"t": "Lesson 4: The Self in Psychology","items": ["William James divided the self into the \"I-Self,\" the active, thinking and acting self that does the perceiving, and the \"Me-Self,\" the empirical self that is perceived and reflected upon. James further broke the Me-Self down into three parts: the Material self (our body and possessions), the Social self (how we are recognized by others), and the Spiritual self (our inner thoughts and values).","David Lester contrasted the idea of Multiple Selves, in which a person takes on different roles and identities depending on the situation, with the Unified Self, in which all of these roles are experienced as forming one single, integrated, composite persona.","Donald Winnicott distinguished between the True Self, which is authentic and emotionally vulnerable, and the False Self, which develops to hide and protect the True Self, often by presenting a version of ourselves designed to impress or please others.","Carl Rogers proposed that psychological distress arises from incongruence — a mismatch between one's ideal self (who we wish to be) and one's real self (who we actually are). The greater this gap, the more likely a person is to experience stress, anxiety, and demoralization."]},{"t": "Lesson 5: The Self in Eastern & Oriental Thought","items": ["An individualistic self places the individual's own needs, choices, and independence first, treating personal autonomy as a core value in how identity is understood.","A collectivistic self treats the group — whether family, community, or society — as more important than any single individual, emphasizing unity, brotherhood, and a degree of selflessness in how one relates to others.","In Buddhism, there is no permanent, unchanging self; the ultimate goal is Nirvana, a state of transcendence in which one is freed from clinging to a fixed sense of self altogether.","In Hinduism, the self (Atman, or soul) is understood in relation to the Law of Karma, the principle that one's actions have consequences that shape future existence, all situated within a broader body of timeless spiritual wisdom.","Confucianism locates self-realization in the proper fulfillment of one's social roles, guided by the principle of the \"Rectification of Names\" — the idea that a person should live up to and be true to the responsibilities carried by their title or position (for example, truly acting as a parent, a ruler, or a friend should act)."]},{"t": "Lesson 6: Physical Self","items": ["The human body performs its physical functions least effectively during infancy and old age, and generally reaches its peak of physical performance during early adulthood.","Adolescence begins with the onset of puberty and is considered the most crucial stage of physical development because of how rapidly the body changes during this period.","Physical growth and development are shaped by the interaction of Nature — heredity, chromosomes, and genes inherited from one's parents — and Nurture, meaning environmental factors such as diet, upbringing, and personal experience.","Humans have 23 pairs of chromosomes in total: 22 pairs are autosomes, which carry most of our genetic information, and 1 pair consists of gonosomes, the sex chromosomes that determine biological sex.","Body image, self-concept, and self-esteem all significantly affect adolescent well-being. A persistently poor body image can contribute to serious eating disorders such as Bulimia Nervosa and Anorexia Nervosa.","Standards of physical beauty are not fixed — they change over time and vary across cultures, though common recurring markers include clear skin, thick hair, a proportioned body, and facial symmetry."]},{"t": "Lesson 7: Sexual & Political Self","items": ["Primary sex characteristics refer to the reproductive organs a person is born with, while secondary sex characteristics are the physical traits — such as body hair, voice changes, and breast development — that emerge later, during puberty.","The three major sex hormones are Testosterone, Estrogen, and Progesterone. Polycystic Ovary Syndrome (PCOS) is a hormonal imbalance in women, often marked by irregular or prolonged menstrual periods or elevated levels of male hormones.","According to Masters and Johnson's model, the Sexual Response Cycle unfolds in five stages, in order: Desire, Excitement, Plateau, Orgasm, and Resolution.","SOGIE is a framework covering several related but distinct aspects of identity: Sexual Orientation refers to who a person is attracted to, while Gender Identity refers to who a person is on the inside — encompassing identities such as Cisgender, Transgender, Non-binary, and Genderfluid.","Robert Sternberg's Triangular Theory of Love proposes that love is built from three components — Passion, Intimacy, and Commitment — which combine in different ways to produce eight distinct types of love, with Consummate Love being the complete form that includes all three components at once.","The notes describe six modern love styles: Ludus (playful, game-like love), Pragma (practical love focused on compatibility), Eros (passionate, romantic love), Mania (obsessive, possessive love), Storge (companionate, friendship-based love), and Agape (selfless, unconditional love).","Marriage practices vary across cultures along several dimensions: Endogamy (marrying within one's own group) versus Exogamy (marrying outside one's group); residence patterns such as Patrilocal, Matrilocal, Neolocal, or Bilocal; and family structures such as Monogamy versus Polygamy, which itself includes Polygyny (one husband, multiple wives) and Polyandry (one wife, multiple husbands).","Sexually transmitted diseases are grouped into two categories: bacterial STDs such as Chlamydia, Gonorrhea, and Syphilis, which can be treated and cured with antibiotics, and viral STDs such as HPV, HIV, and Herpes, which currently have no cure.","The political dimension of the self involves several recognized types of power: Reward Power (control over incentives), Coercive Power (ability to punish), Legitimate Power (authority granted by position), Referent Power (influence through admiration or identification), Expert Power (influence through specialized knowledge), and Informational Power (influence through access to information).","Common leadership styles include Autocratic (centralized control with little input from members), Laissez-Faire (hands-off, letting members decide), Democratic (shared decision-making), Transactional (based on rewards and performance), and Transformational (inspiring change through vision).","Two well-known compliance techniques work in opposite directions: the Door-in-the-Face technique starts with an unreasonably large request expected to be refused, followed by a smaller, more reasonable request that now seems easy to accept; the Foot-in-the-Door technique does the reverse, starting with a small request to make a person more likely to agree to a larger one later."]}]},"pc": {"name": "Purposive Communication","icon": "🗣️","color": "#0EA5A5","examType": "Multiple Choice","coverage": "Lessons 1, 2, and 4 (Communication Process, Cultural Dimensions, Communication & Globalization)","exam": [{"q": "Communication is defined as a systemic process in which people interact through what, according to Wood (2003)?","opts": ["Symbols","Gestures","Technology","Emotions"],"a": 0,"k": "Multiple Choice"},{"q": "In the basic communication model, who encodes the message?","opts": ["Receiver","Source","Channel","Feedback"],"a": 1,"k": "Multiple Choice"},{"q": "Which part of the communication process involves interpreting the received message?","opts": ["Encoding","Decoding","Channel","Noise"],"a": 1,"k": "Multiple Choice"},{"q": "The response of the receiver back to the source is called:","opts": ["Feedback","Noise","Context","Channel"],"a": 0,"k": "Multiple Choice"},{"q": "Lighting, temperature, and noise level are examples of which context?","opts": ["Social Context","Physical Context","Psychological Context","Cultural Context"],"a": 1,"k": "Multiple Choice"},{"q": "The context that refers to the relationship between communicators is:","opts": ["Historical Context","Social Context","Physical Context","Psychological Context"],"a": 1,"k": "Multiple Choice"},{"q": "The background provided by previous communication between participants is called:","opts": ["Cultural Context","Historical Context","Physical Context","Social Context"],"a": 1,"k": "Multiple Choice"},{"q": "Moods and feelings each person brings to communication belong to which context?","opts": ["Psychological Context","Physical Context","Cultural Context","Social Context"],"a": 0,"k": "Multiple Choice"},{"q": "The channel of communication refers to:","opts": ["The people communicating","The means through which messages are transmitted","The message itself","The noise present"],"a": 1,"k": "Multiple Choice"},{"q": "Which type of noise refers to ambiguous words and complex jargon?","opts": ["External Noise","Internal Noise","Semantic Noise","Physical Noise"],"a": 2,"k": "Multiple Choice"},{"q": "Unwanted environmental sound during communication is called:","opts": ["Internal Noise","External Noise","Semantic Noise","Feedback"],"a": 1,"k": "Multiple Choice"},{"q": "Mental or physical distractions coming from within a person are called:","opts": ["External Noise","Internal Noise","Semantic Noise","Cultural Noise"],"a": 1,"k": "Multiple Choice"},{"q": "According to the notes, culture is best described as:","opts": ["A fixed, unchanging system","A set of unique and shared beliefs, values, and norms","An individual personality trait","A form of government"],"a": 1,"k": "Multiple Choice"},{"q": "In collectivist societies, people are generally born into:","opts": ["Nuclear families they must leave","Extended families/in-groups that continue protecting them","Isolated households","No family structure"],"a": 1,"k": "Multiple Choice"},{"q": "In individualist societies, children learn to think in terms of:","opts": ["\"We\"","\"I\"","\"Us\"","\"They\""],"a": 1,"k": "Multiple Choice"},{"q": "In collectivist societies, harmony should be maintained and what should be avoided?","opts": ["Cooperation","Direct confrontations","Socialization","Loyalty"],"a": 1,"k": "Multiple Choice"},{"q": "In individualist societies, friendships are:","opts": ["Predetermined","Voluntary and should be fostered","Arranged by family","Avoided"],"a": 1,"k": "Multiple Choice"},{"q": "High-context communication, with frequent socialization in public places, prevails in which society?","opts": ["Individualist","Collectivist","Low-context","Egocentric"],"a": 1,"k": "Multiple Choice"},{"q": "In collectivist societies, trespasses lead to shame and loss of face for:","opts": ["Self and the group","Self only","The government","No one"],"a": 0,"k": "Multiple Choice"},{"q": "In individualist societies, criteria for marriage partners are:","opts": ["Predetermined by family","Not predetermined","Decided by elders only","Based on wealth only"],"a": 1,"k": "Multiple Choice"},{"q": "Individualist societies encourage use of the word \"I,\" while collectivist societies:","opts": ["Also encourage \"I\"","Avoid the word \"I\"","Never speak of the self","Use \"I\" only formally"],"a": 1,"k": "Multiple Choice"},{"q": "In collectivist societies, personality tests show people score more:","opts": ["Extraverted","Introverted","Ambitious","Competitive"],"a": 1,"k": "Multiple Choice"},{"q": "A larger share of both private and public income is spent on health care in which type of society?","opts": ["Collectivist","Individualist","Both equally","Neither"],"a": 1,"k": "Multiple Choice"},{"q": "In collectivist societies, the internet and email are:","opts": ["Highly attractive and frequently used","Less attractive and less frequently used","Banned","Mandatory"],"a": 1,"k": "Multiple Choice"},{"q": "In individualist societies, the purpose of education is:","opts": ["Learning how to do","Learning how to learn","Group harmony","Obedience"],"a": 1,"k": "Multiple Choice"},{"q": "In collectivist workplaces, hiring and promotion decisions take into account:","opts": ["Skills only","The employee's in-group","Seniority only","Education only"],"a": 1,"k": "Multiple Choice"},{"q": "Chronemics refers to:","opts": ["The use of personal space","The concept of time among cultures","Eye contact patterns","Color symbolism"],"a": 1,"k": "Multiple Choice"},{"q": "A culture that values being on time is described as:","opts": ["Polychronic","Monochronic","Sociocentric","Egocentric"],"a": 1,"k": "Multiple Choice"},{"q": "A polychronic culture is best described as one with:","opts": ["Strict punctuality","Flexible use of time (\"many excuses\")","No concept of time","Digital scheduling only"],"a": 1,"k": "Multiple Choice"},{"q": "Uncertainty avoidance refers to a culture's need to:","opts": ["Avoid conflict","Foresee what is going to happen","Avoid technology","Avoid diversity"],"a": 1,"k": "Multiple Choice"},{"q": "A culture with high uncertainty avoidance values:","opts": ["Spontaneity and risk-taking","Precision and anticipating risk","Ambiguity","Chaos"],"a": 1,"k": "Multiple Choice"},{"q": "A High-Power Distance culture recognizes that:","opts": ["Power should be equally distributed","Unequal distribution of power is normal","Hierarchy is harmful","Everyone has equal authority"],"a": 1,"k": "Multiple Choice"},{"q": "Low-context communication (individualist) is characterized by messages that are:","opts": ["Implied and read between the lines","Precise, simple, and clear","Layered and nuanced","Mostly nonverbal"],"a": 1,"k": "Multiple Choice"},{"q": "High-context communication (collectivist) is characterized by messages that are:","opts": ["Expressed strictly at face value","Sophisticated, nuanced, and layered","Always written","Never implied"],"a": 1,"k": "Multiple Choice"},{"q": "Globalization is best defined as:","opts": ["Isolation of cultures","Growth of economic, political, and cultural interconnectedness across the globe","Decline of technology","A single government for all nations"],"a": 1,"k": "Multiple Choice"},{"q": "The term that suggests there are now more options by which one can communicate is:","opts": ["Diversity","Mediated","Globalization","Xenocentrism"],"a": 1,"k": "Multiple Choice"},{"q": "Diversity, as defined in the notes, endures:","opts": ["Conflict and division","Respect, acceptance, and understanding","Uniformity","Isolation"],"a": 1,"k": "Multiple Choice"},{"q": "Which of the following is NOT listed in the notes as a form of mediated communication?","opts": ["Text Messaging","Video Calling","Face-to-face conversation","Emailing"],"a": 2,"k": "Multiple Choice"},{"q": "A key concern with mediated communication is that participants:","opts": ["Gain more nonverbal cues","Are unable to access nonverbal cues, which may affect interpretation","Communicate faster with no issues at all","Only communicate in person"],"a": 1,"k": "Multiple Choice"},{"q": "The most significant development in communication in recent years, per the notes, is:","opts": ["The invention of the telephone","The advent of smartphones and internet accessibility","The printing press","Radio broadcasting"],"a": 1,"k": "Multiple Choice"},{"q": "According to the notes, most people share the view that technological advances in communication have:","opts": ["Solved all communication issues","Posed alarming concerns and issues at local, political, and global scales","Had no effect on communication","Only benefited education"],"a": 1,"k": "Multiple Choice"},{"q": "Communication is described as \"systemic,\" meaning it:","opts": ["Occurs within a system of interrelated parts that affect one another","Follows strict rules","Is unpredictable","Happens only formally"],"a": 0,"k": "Multiple Choice"},{"q": "Communication as a \"process\" means it is:","opts": ["Static and unchanging","Ongoing and always in motion","Only verbal","Limited to two people"],"a": 1,"k": "Multiple Choice"},{"q": "The \"meaning-making\" aspect of communication is described in the notes as:","opts": ["The least important part","The heart of communication","Only relevant in writing","Irrelevant to symbols"],"a": 1,"k": "Multiple Choice"},{"q": "The Content Level of meaning refers to:","opts": ["The relationship between communicators","The literal message","The emotional tone","The cultural background"],"a": 1,"k": "Multiple Choice"},{"q": "The Relationship Level of meaning, according to the notes:","opts": ["Is often less important than content level","Is often more important than content level","Does not exist","Only applies to written communication"],"a": 1,"k": "Multiple Choice"},{"q": "In the sensory channels of communication, sound relates to verbal symbols while light relates to:","opts": ["Written words only","Nonverbal cues (NVC)","Silence","Feedback"],"a": 1,"k": "Multiple Choice"},{"q": "Culture influences what and how you:","opts": ["Eat","Communicate","Travel","Dress only"],"a": 1,"k": "Multiple Choice"},{"q": "A holistic understanding of communication requires knowledge of:","opts": ["Technology only","Culture and appreciation of cultural diversities","Grammar rules only","Verbal skills only"],"a": 1,"k": "Multiple Choice"},{"q": "Feedback in communication serves to:","opts": ["Confuse the sender","Improve communication","Add noise","Replace the message"],"a": 1,"k": "Multiple Choice"},{"q": "The people communicating in a communication process are called:","opts": ["Channels","Participants","Contexts","Messages"],"a": 1,"k": "Multiple Choice"},{"q": "Encoded and decoded information in the communication process is referred to as:","opts": ["Channel","Noise","Messages","Feedback"],"a": 2,"k": "Multiple Choice"},{"q": "Which cultural dimension concerns whether societies value individual achievement or group harmony?","opts": ["Chronemics","Individualism vs Collectivism","Uncertainty Avoidance","Power Distance"],"a": 1,"k": "Multiple Choice"},{"q": "In collectivist workplaces, the employer-employee relationship is viewed as:","opts": ["A contract between parties in a labor market","Basically moral, like a family link","Purely transactional","Nonexistent"],"a": 1,"k": "Multiple Choice"},{"q": "In individualist societies, management training teaches:","opts": ["Harmony above honesty","Honest sharing of feelings","Silence about problems","Obedience to elders"],"a": 1,"k": "Multiple Choice"},{"q": "In collectivist societies, in-group customers get:","opts": ["Worse treatment","Better treatment (particularism)","No different treatment","Treatment based on universalism"],"a": 1,"k": "Multiple Choice"},{"q": "In individualist societies, every customer gets the same treatment, a principle called:","opts": ["Particularism","Universalism","Collectivism","Favoritism"],"a": 1,"k": "Multiple Choice"},{"q": "Task prevails over relationship in which type of society?","opts": ["Collectivist","Individualist","Sociocentric","Feminine"],"a": 1,"k": "Multiple Choice"},{"q": "Relationship prevails over task in which type of society?","opts": ["Individualist","Collectivist","Egocentric","Masculine"],"a": 1,"k": "Multiple Choice"},{"q": "Which of the following best summarizes the goal of studying purposive communication?","opts": ["To memorize grammar rules only","To communicate effectively and appropriately across different contexts and cultures","To avoid speaking in public","To replace face-to-face communication entirely"],"a": 1,"k": "Multiple Choice"}],"flash": [["Systemic (in Communication)","Occurs within a system of interrelated parts that affect one another."],["Content Level of meaning","The literal message being communicated."],["Relationship Level of meaning","Expresses the relationship between communicators — often MORE important than content."],["Semantic Noise","Ambiguous words, complex jargon that interfere with understanding."],["External Noise","Unwanted environmental sound (e.g., traffic, chatter)."],["Internal Noise","Mental or physical distraction from within a person."],["Physical Context","Lighting, temperature, noise level, environment."],["Historical Context","Background from previous communication between participants."],["Collectivist Society","'We' identity; group needs before individual; harmony over confrontation."],["Individualist Society","'I' identity; individual rights and independence valued most."],["Chronemics","The concept/use of time across cultures (monochronic vs polychronic)."],["Monochronic vs Polychronic","Monochronic = punctual/on-time; Polychronic = flexible, many 'excuses'."],["Uncertainty Avoidance","A culture's need to foresee what will happen and manage risk."],["Power Distance","Degree to which a culture accepts unequal distribution of power."],["Low-Context Communication","Messages are precise, simple, direct (individualist cultures)."],["High-Context Communication","Messages are nuanced, layered, implied (collectivist cultures)."],["Globalization","Growth of economic, political & cultural interconnectedness worldwide."],["Mediated Communication","Communication through channels like text, video call, email, social media."],["Diversity","Respect, acceptance, and understanding of differences (age, gender, culture, etc.)."],["Particularism vs Universalism","In-group gets special treatment vs. everyone treated the same."]],"notes": [{"t": "Lesson 1: The Communication Process and its Components","items": ["Communication is the sharing of meaning within any given context. According to Wood (2003), it is a systemic process — meaning it happens through interrelated, interacting parts — in which people encode and decode messages using shared symbols.","The basic communication model works as follows: a Source encodes a Message, which travels through a Channel to a Receiver who decodes it, after which Feedback flows back from the receiver to the source, allowing the exchange to continue.","Communication takes place within five overlapping contexts: the Physical context (lighting, temperature, and noise in the environment), the Social context (the relationship between the people communicating), the Historical context (the background built up from earlier communication between the same participants), the Psychological context (the moods and feelings each person brings), and the Cultural context (how norms and expectations vary depending on culture).","In this model, Participants are the people doing the communicating, Messages are the information being encoded and decoded, and the Channel is the means through which the message travels — for example, sound carries verbal messages, while light carries nonverbal cues.","Communication can be disrupted by three types of noise: External noise, which comes from the surrounding environment (like traffic or chatter); Internal noise, which comes from within a person (like distraction or fatigue); and Semantic noise, which arises from ambiguous wording or overly complex jargon that gets in the way of understanding.","Feedback plays a crucial role in improving communication by letting the source know how a message was received. Because culture shapes both what we choose to communicate and how we communicate it, culture and communication are ultimately inseparable from one another."]},{"t": "Lesson 2: Cultural Dimensions in Communication","items": ["Collectivist societies tend to emphasize a \"we\" identity: people are typically raised within extended families, harmony is valued over open confrontation, communication tends to be high-context, and strong loyalty is expected toward one's in-group.","Individualist societies, on the other hand, emphasize an \"I\" identity: the typical family unit is the nuclear family, direct confrontation is generally more socially acceptable, communication tends to be low-context, and people are usually treated according to universal standards rather than group membership.","Low-context communication, more typical of individualist cultures, favors messages that are precise, simple, and stated clearly and directly — meaning is expressed mostly at face value, with little left to interpretation.","High-context communication, more typical of collectivist cultures, relies on messages that are sophisticated, nuanced, and layered with meaning; much of what is communicated is implied rather than stated outright, requiring listeners to \"read between the lines.\"","Chronemics is the study of how different cultures understand and use time. Monochronic cultures place a high value on punctuality and treat time as a fixed, linear resource, while Polychronic cultures treat time more flexibly, often juggling multiple tasks or commitments at once and being more tolerant of delays.","Uncertainty Avoidance describes how strongly a culture feels the need to plan for and foresee what will happen next. Cultures with high uncertainty avoidance tend to place a premium on precision, planning, and anticipating risk before it arises.","Power Distance describes how comfortable a culture is with unequal distribution of power. In a High-Power Distance culture, hierarchy and unequal power between individuals are generally seen as normal and expected, rather than something to be resisted.","Beyond these, cultures can also be compared along other dimensions, including Gender (Masculine versus Feminine cultural values), Long-Term versus Short-Term orientation toward the future, and a general tendency toward patience versus short-temperedness in social interactions."]},{"t": "Lesson 4: Communication and Globalization","items": ["Globalization refers to the ongoing growth of economic, political, and cultural interconnectedness among countries and peoples across the globe.","The term \"mediated\" reflects the fact that people today have far more options for how they can communicate with one another — including text messaging, video calls, email, and social media — compared to earlier generations.","Diversity, as used here, refers to the practice of extending respect, acceptance, and understanding to people who differ in age, gender, race, ethnicity, culture, and ideology.","The widespread rise of smartphones and internet access has transformed communication, making it faster, more accessible, more virtual, and more global in scope than ever before.","One significant drawback of mediated communication is that it often strips away nonverbal cues — such as tone of voice, facial expression, and body language — which can lead to messages being misinterpreted or misunderstood.","Despite these conveniences, most people also recognize that advances in communication technology have raised real concerns at the local, national, and global levels, from misinformation to social division.","The key takeaway is to stay aware of these emerging issues, make informed and thoughtful decisions about how technology is used, and commit to using it in an ethical and responsible way."]}]},"hist": {"name": "Readings in Phil. History","icon": "📜","color": "#B45309","examType": "Multiple Choice and Essay","coverage": "All topics discussed (sources, criticism, repositories, Pigafetta, Cavite Mutiny, GomBurZa, Plasencia)","exam": [{"q": "The Greek word \"Historia\" means:","opts": ["A written record","Knowledge acquired through inquiry or investigation","An ancient story","A government archive"],"a": 1,"k": "Multiple Choice"},{"q": "The study of history itself is called:","opts": ["Historiography","Historicism","Chronology","Archival Science"],"a": 0,"k": "Multiple Choice"},{"q": "Traditional historians believed historical events should be backed up with:","opts": ["Oral tradition only","Written documents","Artifacts only","Songs and epics only"],"a": 1,"k": "Multiple Choice"},{"q": "Sources produced while the past event was happening, usually by actors of history themselves, are called:","opts": ["Secondary Sources","Primary Sources","Tertiary Sources","Oral Sources"],"a": 1,"k": "Multiple Choice"},{"q": "A source produced by someone who used a primary source as the subject of their material is called a:","opts": ["Primary Source","Secondary Source","Archival Document","Memorabilia"],"a": 1,"k": "Multiple Choice"},{"q": "Comparing different sources to verify historical facts is called:","opts": ["Corroboration","Historiography","Criticism","Analysis"],"a": 0,"k": "Multiple Choice"},{"q": "External criticism involves verifying historical evidence through:","opts": ["The truthfulness of the content","Physical characteristics and material consistency with the period","The author's motives only","Modern interpretation"],"a": 1,"k": "Multiple Choice"},{"q": "Internal criticism examines:","opts": ["Paper and ink only","The content of the material, including its truthfulness","Only the date","Only the author's handwriting"],"a": 1,"k": "Multiple Choice"},{"q": "In Gottschalk's Six Points, the question \"Who wrote it?\" refers to:","opts": ["Date","Localization","Authorship","Integrity"],"a": 2,"k": "Multiple Choice"},{"q": "The Six Point that asks \"What was its original form?\" is:","opts": ["Analysis","Integrity","Credibility","Localization"],"a": 1,"k": "Multiple Choice"},{"q": "The Six Point concerned with \"the evidential value of its content\" is:","opts": ["Credibility","Date","Authorship","Analysis"],"a": 0,"k": "Multiple Choice"},{"q": "According to Gottschalk (1969), it is impossible for historians to avoid using:","opts": ["Primary sources","Secondary sources","Artifacts","Oral testimony"],"a": 1,"k": "Multiple Choice"},{"q": "Howell and Prevenier identified how many internal criteria factors for evaluating a document?","opts": ["Five","Six","Seven","Eight"],"a": 2,"k": "Multiple Choice"},{"q": "\"Genealogy of the document\" refers to:","opts": ["The family of the author","The development of the document (original, copy, or copy of a copy)","The document's date","The document's location"],"a": 1,"k": "Multiple Choice"},{"q": "\"Genesis of the document\" includes:","opts": ["The situation and authorities during the document's production","The author's family history","The document's physical materials","Its translation"],"a": 0,"k": "Multiple Choice"},{"q": "\"Originality of the document\" examines whether it is:","opts": ["Handwritten or typed","An eye/earwitness account or merely passed-on information","Old or new","Foreign or local"],"a": 1,"k": "Multiple Choice"},{"q": "Deducing meaning from a document relates to which of Howell and Prevenier's factors?","opts": ["Interpretation of the document","Genealogy","Genesis","Authorial authority"],"a": 0,"k": "Multiple Choice"},{"q": "\"Authorial authority of the document\" refers to:","opts": ["Government approval of the document","The relationship between the document's subject matter and its author","The author's fame","The document's age"],"a": 1,"k": "Multiple Choice"},{"q": "\"The competence of the observer\" refers to:","opts": ["The author's capability and qualification to comprehend and report information","The author's popularity","The reader's ability to understand","The translator's skill"],"a": 0,"k": "Multiple Choice"},{"q": "\"Trustworthiness of the observer\" refers to:","opts": ["The author's wealth","The author's integrity — whether they fabricate or report truthfully","The document's age","The number of copies made"],"a": 1,"k": "Multiple Choice"},{"q": "The National Archives of the Philippines is located on:","opts": ["Roxas Boulevard","United Nations Avenue, Manila","EDSA","Taft Avenue"],"a": 1,"k": "Multiple Choice"},{"q": "Which repository preserves Spanish-era documents such as Cedulas and Royal Decrees?","opts": ["National Museum","National Archives of the Philippines","National Library","NHCP"],"a": 1,"k": "Multiple Choice"},{"q": "The National Library of the Philippines is under the jurisdiction of the:","opts": ["Department of Education","National Commission for Culture and the Arts","Department of Tourism","University of the Philippines"],"a": 1,"k": "Multiple Choice"},{"q": "The legal deposit law implemented by the National Library requires:","opts": ["Publishers to submit copies of their works","All citizens to register books","Government funding of all publications","No copyright on any book"],"a": 0,"k": "Multiple Choice"},{"q": "The NHCP promotes Philippine history and cultural heritage through:","opts": ["Research, dissemination, conservation, sites management, and heraldry works","Military training","Tourism marketing only","Tax collection"],"a": 0,"k": "Multiple Choice"},{"q": "The National Museum of the Philippines primarily:","opts": ["Manages government archives","Acquires and documents historical and cultural artifacts","Publishes textbooks","Regulates media"],"a": 1,"k": "Multiple Choice"},{"q": "Antonio Pigafetta was:","opts": ["A Spanish conquistador","An Italian scholar and chronicler from Vicenza","A Portuguese navigator","A Filipino datu"],"a": 1,"k": "Multiple Choice"},{"q": "Pigafetta joined which expedition in 1519?","opts": ["Legazpi's","Magellan's","Villalobos's","Loaisa's"],"a": 1,"k": "Multiple Choice"},{"q": "Pigafetta's manuscript describing the 1519–1522 voyage is titled:","opts": ["Relación de las Islas Filipinas","Primo Viaggio Intorno al Mondo","Customs of the Tagalogs","Sucesos de las Islas Filipinas"],"a": 1,"k": "Multiple Choice"},{"q": "The surviving manuscript of Pigafetta's account is associated with which institution?","opts": ["Vatican Library","Biblioteca Ambrosiana in Milan","British Museum","National Archives of Spain"],"a": 1,"k": "Multiple Choice"},{"q": "The expedition first reached the Philippine archipelago in:","opts": ["January 1521","March 1521","June 1521","December 1520"],"a": 1,"k": "Multiple Choice"},{"q": "The first encounter described by Pigafetta, involving exchange of food and gifts, occurred at:","opts": ["Cebu","Mazaua","Homonhon","Limasawa"],"a": 2,"k": "Multiple Choice"},{"q": "Who served as an important interpreter during the expedition, showing wider Southeast Asian connections?","opts": ["Rajah Colambu","Enrique of Malacca","Lapu-Lapu","Rajah Humabon"],"a": 1,"k": "Multiple Choice"},{"q": "The expedition reached Mazaua and interacted with local leader:","opts": ["Rajah Humabon","Rajah Colambu","Lapu-Lapu","Datu Sikatuna"],"a": 1,"k": "Multiple Choice"},{"q": "The Easter Sunday Mass described by Pigafetta occurred on:","opts": ["March 16, 1521","March 31, 1521","April 27, 1521","May 1, 1521"],"a": 1,"k": "Multiple Choice"},{"q": "Many historians today believe Mazaua refers to:","opts": ["Cebu","Butuan","Limasawa off Southern Leyte","Bohol"],"a": 2,"k": "Multiple Choice"},{"q": "Before the Limasawa theory prevailed, some believed the First Mass was held at:","opts": ["Masao, Butuan","Cebu City","Tacloban","Iloilo"],"a": 0,"k": "Multiple Choice"},{"q": "The NHCP found the evidence for the pro-Butuan claim to be:","opts": ["Fully convincing","Not convincing enough","Undisputed","The official position"],"a": 1,"k": "Multiple Choice"},{"q": "The pro-Butuan claim was weakened by evidence that a Spanish expedition (Villalobos) landed in Mindanao how many years after the First Mass?","opts": ["10 years","15 years","22 years","30 years"],"a": 2,"k": "Multiple Choice"},{"q": "According to the notes, primary sources should be:","opts": ["Accepted as absolute truth","Read, contextualized, analyzed, corroborated, and interpreted","Ignored in favor of secondary sources","Rejected if biased"],"a": 1,"k": "Multiple Choice"},{"q": "Which group's perspective is described as LESS visible in Pigafetta's narrative?","opts": ["The expedition's own perspective","Ordinary local inhabitants, women, and children","Pigafetta's own view","The King of Spain's view"],"a": 1,"k": "Multiple Choice"},{"q": "The Cavite Mutiny was an uprising of Filipino military personnel at:","opts": ["Fort Santiago","Fort San Felipe, Cavite","Intramuros","Corregidor"],"a": 1,"k": "Multiple Choice"},{"q": "Approximately how many locally recruited colonial troops and laborers took part in the Cavite Mutiny?","opts": ["50","100","200","500"],"a": 2,"k": "Multiple Choice"},{"q": "According to Jose Montero y Vidal, the mutiny was caused by:","opts": ["Religious persecution","Removal of privileges enjoyed by Cavite arsenal laborers","A foreign invasion","A natural disaster"],"a": 1,"k": "Multiple Choice"},{"q": "Governor-General Izquierdo insisted the mutiny was stimulated by:","opts": ["Spanish friars","Native clergy, mestizos, and lawyers","Foreign powers","The Katipunan"],"a": 1,"k": "Multiple Choice"},{"q": "According to Izquierdo's account, who would have been selected as leader if the mutiny succeeded?","opts": ["Jose Rizal","Jose Burgos or Jacinto Zamora","Emilio Aguinaldo","Andres Bonifacio"],"a": 1,"k": "Multiple Choice"},{"q": "Trinidad Pardo de Tavera argued that Filipinos:","opts": ["Wanted full separation from Spain","Had no intention of separation, but wanted material and educational advancement","Fully supported the friars","Wanted to restore the datu system"],"a": 1,"k": "Multiple Choice"},{"q": "The mutineers mistakenly believed a signal for uprising was fireworks celebrating:","opts": ["A royal wedding","Our Lady of Loreto, patron saint of Sampaloc","Christmas","Independence Day"],"a": 1,"k": "Multiple Choice"},{"q": "The three priests implicated and executed after the Cavite Mutiny were known as:","opts": ["Rizal, Bonifacio, Aguinaldo","Gomez, Burgos, and Zamora (GomBurZa)","Silang, Dagohoy, and Malong","Del Pilar, Luna, and Mabini"],"a": 1,"k": "Multiple Choice"},{"q": "GomBurZa were executed by:","opts": ["Firing squad","Garrote in Luneta (Bagumbayan)","Hanging","Beheading"],"a": 1,"k": "Multiple Choice"},{"q": "Jose Rizal dedicated El Filibusterismo to GomBurZa because:","opts": ["They were his relatives","His brother Paciano was a close friend of Burgos","They funded his education","They were his professors"],"a": 1,"k": "Multiple Choice"},{"q": "Regarding Rizal's alleged retraction, the notes state that:","opts": ["It is definitively proven true","There is still no solid proof that he retracted, despite the alleged letter","It was immediately accepted by all historians","Rizal publicly confirmed it before execution"],"a": 1,"k": "Multiple Choice"},{"q": "Juan de Plasencia's work \"Customs of the Tagalogs\" was written in:","opts": ["1521","1589","1650","1762"],"a": 1,"k": "Multiple Choice"},{"q": "Juan de Plasencia was a friar of which religious order?","opts": ["Dominican","Jesuit","Franciscan","Augustinian"],"a": 2,"k": "Multiple Choice"},{"q": "According to Plasencia, a barangay typically consisted of how many people led by a datu?","opts": ["10–20","30–100","200–300","500–1000"],"a": 1,"k": "Multiple Choice"},{"q": "The highest social class in the barangay system, per Plasencia, was the:","opts": ["Aliping Namamahay","Maharlika","Datu (Chieftain)","Aliping Saguiguilid"],"a": 2,"k": "Multiple Choice"},{"q": "The Maharlika (nobles) were characterized by:","opts": ["Paying heavy taxes","Being born free and not paying taxes","Being slaves","Working the land for others"],"a": 1,"k": "Multiple Choice"},{"q": "Which class served a master, helped cultivate land, and could be treated as property that could be sold?","opts": ["Maharlika","Aliping Namamahay","Aliping Saguiguilid","Datu"],"a": 2,"k": "Multiple Choice"},{"q": "A person could become emancipated from slavery through all of the following EXCEPT:","opts": ["Forgiveness","Paying debt","Committing a crime","Bravery"],"a": 2,"k": "Multiple Choice"},{"q": "Under Plasencia's account, before marriage, a man was required to give a dowry called:","opts": ["Paninilbihan","Bigay-kaya","Tapis","Putong"],"a": 1,"k": "Multiple Choice"}],"flash": [["Historiography","The study of history itself — how history is written and interpreted."],["Primary Source","Produced during the event itself, by an actor/eyewitness (e.g., letters, government records)."],["Secondary Source","Produced later by someone using primary sources as their subject."],["Corroboration","Comparing different sources to check and confirm facts."],["External Criticism","Checking a document's physical characteristics (paper, ink, language) vs. its claimed period."],["Internal Criticism","Examining the content/truthfulness of a document, including the author's context and agenda."],["Gottschalk's Six Points","Date, Localization, Authorship, Analysis, Integrity, Credibility."],["Howell & Prevenier's 7 Factors","Genealogy, Genesis, Originality, Interpretation, Authorial authority, Competence, Trustworthiness of the observer."],["Antonio Pigafetta","Italian chronicler on Magellan's 1519 expedition; wrote 'Primo Viaggio Intorno al Mondo.'"],["Homonhon","Site of the expedition's first encounter with local inhabitants (food/gift exchange)."],["Mazaua","Site of the March 31, 1521 Easter Sunday Mass; identified by NHCP as modern-day Limasawa."],["Enrique of Malacca","Magellan's interpreter, showing Southeast Asian connections during the voyage."],["Cavite Mutiny (1872)","Uprising of ~200 Filipino soldiers/laborers at Fort San Felipe, Cavite; used to implicate GomBurZa."],["GomBurZa","Mariano Gomez, Jose Burgos, Jacinto Zamora — priests executed by garrote in 1872."],["Rizal's Retraction","A disputed letter claiming Rizal retracted his anti-Catholic views — no solid proof it was genuine."],["Juan de Plasencia","Franciscan friar who wrote 'Customs of the Tagalogs' (1589), documenting native customs."],["Datu / Maharlika / Aliping Namamahay / Aliping Saguiguilid","Social classes: Chief, Nobles (free, no tax), Commoners (own house), Slaves (property, can be sold)."],["Bigay-kaya","A pre-marriage dowry (land or gold) given by the groom, per Plasencia's account."]],"essay": ["Explain why bias in a primary source does not automatically make it useless as historical evidence.","Discuss the historical debate on the site of the First Mass (Limasawa vs Butuan) and explain the significance of the NHCP's findings.","Compare the differing Spanish-era accounts of the Cavite Mutiny (Montero y Vidal, Izquierdo, Pardo de Tavera). What does this reveal about how history can be interpreted differently?","Why do historians still rely on secondary sources despite their limitations, according to Gottschalk?","Describe the social class structure of early Tagalog society according to Juan de Plasencia's account, and explain how one could move between classes."],"notes": [{"t": "Meaning & Relevance of History","items": ["History is the study of past events and the causes and effects behind them. The word itself comes from the Greek \"Historia,\" meaning knowledge gained through inquiry or investigation.","Historiography is the study of history itself — how history is researched, written, and interpreted. Because historical accounts are inevitably shaped by the historian's own perspective, historians rely on rigorous methodology to keep their conclusions grounded and credible.","A Primary Source is one produced at the time an event was happening, typically by an actual participant or eyewitness — examples include official archives, personal letters, government records, and physical artifacts.","A Secondary Source, by contrast, is produced later by someone who used primary sources as the subject or basis of their own account or analysis.","Corroboration refers to the practice of comparing multiple independent sources against one another in order to verify and confirm historical facts."]},{"t": "External & Internal Criticism / Evaluating Sources","items": ["External Criticism involves verifying a document's authenticity by examining its physical characteristics — such as the paper, ink, and language used — to see whether they are actually consistent with the period the document claims to be from.","Internal Criticism, by contrast, involves examining the content of the document itself: how truthful it is, the context in which the author was writing, and whether the author may have had a particular agenda that shaped what they wrote.","Historian Louis Gottschalk proposed Six Points for evaluating a historical document: Date, Localization, Authorship, Analysis, Integrity, and Credibility.","Gottschalk also argued that it is essentially impossible for historians to avoid using secondary sources altogether, since these sources help build essential background knowledge and can even help historians catch errors in primary accounts.","Historians Howell and Prevenier identified seven internal factors for evaluating a document's reliability: its Genealogy (how the document was copied or transmitted), its Genesis (the circumstances of its creation), its Originality (whether it is a firsthand account or secondhand information), its Interpretation (the meaning that can be drawn from it), its Authorial authority (the author's relationship to the subject matter), the Competence of the observer (the author's ability to understand and report accurately), and the Trustworthiness of the observer (the author's honesty and integrity).","A document's bias does not automatically make it useless as a historical source — in fact, recognizing that bias can help historians understand how the author perceived and interpreted the events they described. The essential task of the historian is to read, contextualize, analyze, corroborate, and interpret each source carefully."]},{"t": "Repositories of Primary Sources","items": ["The National Archives of the Philippines, located on United Nations Avenue in Manila, preserves important Spanish-era documents, including notarial records, civil service records, and historical maps.","The National Library of the Philippines operates under the National Commission for Culture and the Arts (NCCA). It implements the country's legal deposit law, which requires publishers to submit copies of their works, and it promotes reading and research nationwide.","The National Historical Commission of the Philippines (NHCP) works to promote Philippine history and cultural heritage through research, dissemination, conservation, the management of historical sites, and heraldry-related work.","The National Museum of the Philippines is primarily responsible for acquiring and documenting the country's historical and cultural artifacts."]},{"t": "Pigafetta's First Voyage","items": ["Antonio Pigafetta was an Italian scholar and chronicler from Vicenza who joined Ferdinand Magellan's expedition when it set sail in 1519, eventually writing a detailed account of the voyage titled \"Primo Viaggio Intorno al Mondo\" (\"First Voyage Around the World\").","Pigafetta's original manuscript, dating from around 1525, still survives today and is held at the Biblioteca Ambrosiana in Milan, Italy.","The expedition first reached the Philippine archipelago in March 1521. Their first encounter with local inhabitants — an exchange of food and gifts — took place at Homonhon, with Enrique of Malacca serving as an important interpreter who revealed the expedition's wider connections across Southeast Asia.","On March 28, 1521, the expedition reached Mazaua, where they met the local leader Rajah Colambu. It was here, on March 31, 1521, Easter Sunday, that the expedition held the now-famous First Mass.","A long-running historical debate has centered on the exact location of Mazaua. The National Historical Commission of the Philippines (NHCP) has concluded that Mazaua corresponds to modern-day Limasawa in Southern Leyte. An earlier, competing claim held that the Mass took place at Masao, Butuan — but this theory was significantly weakened by the fact that a Spanish expedition under Villalobos did not reach Mindanao until 1543, a gap of 22 years that the NHCP found difficult to reconcile with the Butuan claim.","While Pigafetta's account preserved valuable details about the people, economy, politics, culture, and geography he encountered, it is nonetheless filtered entirely through his own perspective as a European visitor. Voices that remain far less visible in his narrative include those of ordinary local inhabitants, women and children, and any perspectives that opposed the expedition."]},{"t": "Cavite Mutiny & GomBurZa","items": ["In 1872, roughly 200 locally recruited Filipino soldiers and laborers rose up at Fort San Felipe in Cavite. The mutiny was unsuccessful, and many of the participants were subsequently executed.","The Spanish historian Jose Montero y Vidal attributed the mutiny to the removal of long-standing privileges enjoyed by the laborers at the Cavite arsenal, such as their exemption from tribute and forced labor.","Governor-General Rafael Izquierdo, by contrast, insisted that the mutiny had been instigated by native clergy, mestizos, and lawyers, and claimed that Jose Burgos or Jacinto Zamora would have been installed as leader had the uprising succeeded.","Filipino scholar Trinidad Pardo de Tavera offered yet another interpretation, arguing that Filipinos at the time had no real intention of separating from Spain, but were instead seeking material and educational advancement within the existing colonial system.","The mutineers were reportedly triggered into acting by fireworks they mistook for a signal — the fireworks were actually part of a celebration for Our Lady of Loreto, the patron saint of Sampaloc.","Three priests — Mariano Gomez, Jose Burgos, and Jacinto Zamora, collectively remembered as GomBurZa — were implicated in the mutiny and executed by garrote at Luneta (then known as Bagumbayan) in 1872.","Jose Rizal later dedicated his novel El Filibusterismo to the memory of GomBurZa, partly because his own brother, Paciano, had been a close friend of Father Burgos. Many historians regard the execution of GomBurZa as a pivotal moment that helped spark the rise of Filipino nationalism, eventually leading to the 1896 Philippine Revolution.","Rizal is also said to have retracted his anti-Catholic views shortly before his execution, through a disputed letter — however, historians note that there is still no solid, conclusive proof that this retraction letter is authentic."]},{"t": "Juan de Plasencia's Customs of the Tagalogs (1589)","items": ["Juan de Plasencia was a Franciscan friar, born in Spain and later stationed in the Philippines, who died in Liliw, Laguna in 1590. He documented the customs of the native Tagalog people at the order of the Spanish king in his work, \"Customs of the Tagalogs\" (1589).","According to Plasencia, a typical barangay consisted of 30 to 100 people led by a Datu. Philippine society at the time was organized into distinct classes, from highest to lowest: the Datu (chieftain), the Maharlika (nobles, who were born free and did not pay tax), the Aliping Namamahay (commoners who maintained their own household), and the Aliping Saguiguilid (slaves, who could be treated as property).","Inheritance of chieftainship typically passed to the eldest son; if the Datu had no sons, the position could instead pass to his eldest daughter.","A person could become enslaved through captivity, debt, inheritance, purchase, or as punishment for a crime. Conversely, a slave could be emancipated — freed from slavery — through forgiveness, by paying off their debt, through condonation, or through an act of bravery.","Courtship traditionally began with a period of service called Paninilbihan, during which the suitor served the bride's family. Marriage dowries could include Bigay-kaya (property or gold given to the bride's family), Panghihimuyat, and Bigay-suso.","Early Tagalog religious belief centered on Bathala, the supreme being, alongside many lesser gods associated with specific aspects of life — for example, Idayanale, god of agriculture; Sidapa, god of death; and Mandarangan, god of war. Spirit mediums known as babaylan or katalona served as intermediaries between the people and these deities."]}]},"ic": {"name": "Intro to Communication","icon": "💬","color": "#7C3AED","examType": "Identification, Multiple Choice, Fill in the Blanks, Matching Type","coverage": "Lessons 1 & 2 (Why We Study Communication, Models of Communication, Perception & the Self)","exam": [{"q": "This term refers to the process in which people interact with and through symbols to create and interpret meanings.","opts": ["Communication","Perception","Culture","Persuasion"],"a": 0,"k": "Identification"},{"q": "Which is NOT one of the three main models of communication?","opts": ["Linear","Interactive","Transactional","Cyclical"],"a": 3,"k": "Multiple Choice"},{"q": "The ____ model is a one-way, straight-line process where a sender encodes and sends a message through a channel to a receiver.","opts": ["Linear","Interactive","Transactional","Circular"],"a": 0,"k": "Fill in the Blank"},{"q": "The Transactional model of communication views communication as:","opts": ["One-way and static","A continuous, constantly changing process","Purely written","Irrelevant to relationships"],"a": 1,"k": "Multiple Choice"},{"q": "In the Interactive model, people create and interpret messages within their:","opts": ["Personal fields of experience","Government institutions","Social media accounts","Dictionaries"],"a": 0,"k": "Multiple Choice"},{"q": "This level of meaning refers to the literal message being communicated.","opts": ["Content Level","Relationship Level","Contextual Level","Symbolic Level"],"a": 0,"k": "Identification"},{"q": "Which level of meaning expresses the relationship between communicators, and is often considered more important?","opts": ["Content Level","Relationship Level","Historical Level","Cultural Level"],"a": 1,"k": "Multiple Choice"},{"q": "Understanding communication offers an answer to the painful divisions between:","opts": ["Self and others","Rich and poor","Past and future","Science and art"],"a": 0,"k": "Multiple Choice"},{"q": "Humans
