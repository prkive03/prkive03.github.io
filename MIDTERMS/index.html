retation","Interpretation, Selection, Organization"],"a": 1,"k": "Multiple Choice"},{"q": "Constructivism states that we organize and interpret experience by applying cognitive structures called:","opts": ["Schemata","Stereotypes","Scripts","Prototypes"],"a": 0,"k": "Multiple Choice"},{"q": "This type of schema defines the clearest or ideal example of a category.","opts": ["Prototype","Personal Construct","Stereotype","Script"],"a": 0,"k": "Identification"},{"q": "This mental yardstick allows us to measure a person or situation along a bipolar dimension of judgment.","opts": ["Prototype","Personal Construct","Stereotype","Script"],"a": 1,"k": "Identification"},{"q": "This is a predictive generalization about a person or situation based on the category in which we place something.","opts": ["Prototype","Personal Construct","Stereotype","Script"],"a": 2,"k": "Identification"},{"q": "This schema is a sequence of actions that spells out how we and others are expected to act in a specific situation.","opts": ["Prototype","Personal Construct","Stereotype","Script"],"a": 3,"k": "Identification"},{"q": "Attribution refers to:","opts": ["The message channel used","The explanation we make for people's behavior","A type of noise","A nonverbal cue"],"a": 1,"k": "Multiple Choice"},{"q": "When we explain someone's behavior based on their character, personality, or choice, this is called:","opts": ["External attribution","Internal (dispositional) attribution","Situational attribution","Cultural attribution"],"a": 1,"k": "Multiple Choice"},{"q": "When we explain behavior based on the situation or environment, this is called:","opts": ["Internal attribution","External (situational) attribution","Dispositional attribution","Personal attribution"],"a": 1,"k": "Multiple Choice"},{"q": "Standpoint theory claims that a culture includes:","opts": ["Only one unified perspective","A number of social communities with different degrees of social status and privilege","No internal variation","Only economic classes"],"a": 1,"k": "Multiple Choice"},{"q": "Cognitive complexity refers to:","opts": ["How many languages a person speaks","The number of constructs used and how abstractly/elaborately they interact to shape perception","Physical strength","Memory capacity"],"a": 1,"k": "Multiple Choice"},{"q": "Cognitively complex people tend to be:","opts": ["Rigid and resistant to new information","Flexible in interpreting complicated phenomena and integrating new information","Unable to adapt communication","Less empathetic"],"a": 1,"k": "Multiple Choice"},{"q": "Person-centered perception entails:","opts": ["Abstract thinking and a broad range of schemata to perceive another as a unique individual","Only stereotyping others","Ignoring individual differences","Avoiding communication"],"a": 0,"k": "Multiple Choice"},{"q": "Person-centered perception is NOT the same as:","opts": ["Communication","Empathy","Perception","Attribution"],"a": 1,"k": "Multiple Choice"},{"q": "Empathy involves:","opts": ["Ignoring others' perspectives","Recognizing another's perspective and adapting your communication accordingly","Only feeling pity","Avoiding social contact"],"a": 1,"k": "Multiple Choice"},{"q": "The self is a process that involves ____ and acting from social perspectives learned through communication.","opts": ["Internalizing","Ignoring","Rejecting","Memorizing"],"a": 0,"k": "Fill in the Blank"},{"q": "According to the notes, \"The Self arises in\":","opts": ["Isolation","Communication with others","Genetics","Formal education only"],"a": 1,"k": "Multiple Choice"},{"q": "These are rules for how we are supposed to live and who we are supposed to be, taught by family.","opts": ["Attachment styles","Identity scripts","Personal constructs","Prototypes"],"a": 1,"k": "Identification"},{"q": "These are patterns of parenting that teach us who we and others are and how to relate to others.","opts": ["Identity scripts","Attachment styles","Schemata","Standpoints"],"a": 1,"k": "Identification"},{"q": "A consistently attentive and loving parenting style describes which attachment style?","opts": ["Fearful","Dismissive","Secure","Avoidant"],"a": 2,"k": "Multiple Choice"},{"q": "A negative, rejecting, or abusive parenting style describes which attachment style?","opts": ["Secure","Fearful","Dismissive","Ambivalent"],"a": 1,"k": "Multiple Choice"},{"q": "A disinterested, rejecting, or abusive parenting style describes which attachment style?","opts": ["Secure","Fearful","Dismissive","Anxious"],"a": 2,"k": "Multiple Choice"},{"q": "Comparing yourself to your peers is known as:","opts": ["Social comparison","Self-attribution","Cognitive dissonance","Standpoint analysis"],"a": 0,"k": "Multiple Choice"},{"q": "Which factor affecting perception concerns differences in sensory abilities, such as tolerance for spicy food or cold?","opts": ["Culture","Physiology","Social roles","Cognitive abilities"],"a": 1,"k": "Multiple Choice"},{"q": "Culture is described as a set of taken-for-granted assumptions that:","opts": ["Form the patterns of our lives and guide how we perceive, think, feel, and act","Only apply to foreigners","Are irrelevant to communication","Never change"],"a": 0,"k": "Multiple Choice"},{"q": "Messages that tell us we are expected to fulfill particular roles affect perception through:","opts": ["Physiology","Social roles","Cognitive complexity","Genetics"],"a": 1,"k": "Multiple Choice"},{"q": "Less cognitively complex people tend to:","opts": ["Integrate new information flexibly","Ignore information that doesn't fit their impression or use it to replace it","Communicate in highly adaptive ways","Recognize subtle differences easily"],"a": 1,"k": "Multiple Choice"},{"q": "\"Common ground\" in perception and communication involves:","opts": ["Information sharing, embracing diversity, understanding, co-existence","Only agreement","Avoiding differences","Competition"],"a": 0,"k": "Multiple Choice"},{"q": "The 10 careers in communication listed in the notes include all EXCEPT:","opts": ["Communication Director","News Analyst","Civil Engineer","Social Media Manager"],"a": 2,"k": "Multiple Choice"},{"q": "Which career focuses on ensuring an organization's goals are disseminated to stakeholders to build its reputation?","opts": ["Development Work","Corporate Communication","Market Research","Broadcast Announcing"],"a": 1,"k": "Multiple Choice"},{"q": "Development Work in communication involves:","opts": ["Writing books","Working for the homeless and advocating for the marginalized","Only broadcasting","Stock market analysis"],"a": 1,"k": "Multiple Choice"},{"q": "Communication Research helps organizations by studying processes such as:","opts": ["Message production and marketing","Cooking techniques","Athletic training","Architecture"],"a": 0,"k": "Multiple Choice"},{"q": "Communication Education involves university teaching positions specializing in fields such as:","opts": ["Intercultural and development communication","Culinary arts","Civil law","Mechanical engineering"],"a": 0,"k": "Multiple Choice"},{"q": "\"____ is a systematic process in which people interact with and through symbols to create and interpret meanings.\"","opts": ["Perception","Communication","Culture","Persuasion"],"a": 1,"k": "Fill in the Blank"},{"q": "The word \"systematic\" in the definition of communication means it:","opts": ["Occurs randomly","Occurs within a system of interrelated parts that affect one another","Is only formal","Avoids feedback"],"a": 1,"k": "Multiple Choice"},{"q": "The word \"process\" in the definition of communication emphasizes that it is:","opts": ["Fixed","Ongoing and always in motion","Only written","Only spoken"],"a": 1,"k": "Multiple Choice"},{"q": "Which concept explains that a culture includes communities with varying social status and privilege?","opts": ["Standpoint Theory","Attribution Theory","Cognitive Dissonance","Uses and Gratification"],"a": 0,"k": "Matching Type"},{"q": "According to the notes, one characteristic of modern culture is an emphasis on:","opts": ["Slowness and tradition","Technology and its offspring, speed","Isolation","Silence"],"a": 1,"k": "Multiple Choice"},{"q": "Family communication shapes identity through direct definition, identity scripts, and:","opts": ["Attachment style","Income level","Nationality","Physical appearance only"],"a": 0,"k": "Multiple Choice"},{"q": "Which schema type would apply when you predict a new acquaintance's behavior based on a group category you place them in?","opts": ["Prototype","Personal Construct","Stereotype","Script"],"a": 2,"k": "Multiple Choice"},{"q": "Which best describes 'content' vs 'relationship' levels of meaning?","opts": ["Content = literal message, Relationship = connection between communicators","Content = emotion, Relationship = logic","Content = culture, Relationship = language","They are the same thing"],"a": 0,"k": "Multiple Choice"},{"q": "The interactive model of communication, compared to the linear model, adds emphasis on:","opts": ["One-way transmission","Personal fields of experience in interpreting messages","Complete absence of feedback","Purely mechanical transmission"],"a": 1,"k": "Multiple Choice"},{"q": "Perception and communication influence each other because perception:","opts": ["Has no effect on communication","Shapes our understanding of others and our communication choices","Is unrelated to choice-making","Only matters in nonverbal communication"],"a": 1,"k": "Multiple Choice"}],"flash": [["Communication (definition)","A systematic process in which people interact with and through symbols to create and interpret meanings (Wood)."],["Linear Model","One-way, straight-line: sender encodes → channel → receiver decodes."],["Interactive Model","People create/interpret messages within personal fields of experience."],["Transactional Model","Communication as a continuous, constantly changing process."],["Content Level","The literal message."],["Relationship Level","The connection/relationship between communicators — often more important."],["Schemata","Cognitive structures we use to organize and interpret experience (constructivism)."],["Prototype","The clearest/ideal example of a category."],["Personal Construct","A mental yardstick to judge someone/something along a bipolar dimension."],["Stereotype","A predictive generalization based on category placement."],["Script","A sequence of actions defining expected behavior in a situation."],["Attribution","The explanation we give for someone's behavior."],["Internal (Dispositional) Attribution","Explaining behavior by character/personality/choice."],["External (Situational) Attribution","Explaining behavior by the situation/environment."],["Standpoint Theory","A culture contains communities with different social status/privilege."],["Cognitive Complexity","How many/abstract the constructs are that shape our perception."],["Person-Centered Perception","Perceiving another as a unique individual (not the same as empathy)."],["Empathy","Recognizing another's perspective and adapting your communication to it."],["Identity Scripts","Family-taught rules for how we're supposed to live/who we're supposed to be."],["Attachment Styles","Secure, Fearful, Dismissive — parenting patterns shaping how we relate to others."]],"notes": [{"t": "Lesson 1: Why Do We Study Communication?","items": ["Studying communication helps address some of the most persistent divides people experience — between self and others, between the private and the public, and between inner thought and the outer world we share with others.","In our personal relationships, humans appear to be innately wired to connect with one another. It is often the unremarkable, everyday, small moments of interaction — not just the big dramatic ones — that sustain the rhythm of an intimate relationship over time.","Communication is equally vital in professional life, particularly in fields like teaching, law, sales, and counseling. Even medical schools have begun factoring communication skills, especially the ability to work well in teams, into their admissions decisions.","Civic life demands more than simply voting or paying passing attention to politics — genuine civic engagement includes actively working together with others, both formally and informally, within groups.","The definition of communication rests on several key ideas: it is systematic, meaning it happens through interrelated parts that affect one another; it is a process, meaning it is ongoing and always changing rather than fixed; and at its heart, it is about meaning-making, since communication ultimately depends on shared symbols to create and interpret meaning.","Every message can be understood on two levels: the Content Level, which is simply the literal information being conveyed, and the Relationship Level, which expresses the nature of the relationship between the people communicating — and which is often, surprisingly, the more important of the two."]},{"t": "Lesson 2: Models of Communication & Careers","items": ["The Linear Model of communication describes a one-way, straight-line process: a sender encodes a message, which travels through a channel to a receiver, with no built-in provision for a response.","The Interactive Model builds on this by recognizing that people create and interpret messages through their own personal fields of experience — meaning that each person brings their own background and perspective to how a message is understood.","The Transactional Model goes further still, treating communication as a continuous, constantly changing process in which both people are simultaneously sending and receiving messages, rather than simply taking turns.","Several career paths center on communication as a discipline, including Communication Education (teaching communication at the university level), Communication Research (studying communication processes to inform organizations), Corporate Communication (managing an organization's public messaging), and Development Work (using communication to advocate for and serve marginalized communities).","Ten common careers within the communication field include Communication Director, Public Relations Specialist, News Analyst/Reporter/Journalist, Editor, Writer, Market Researcher, Marketing Communication Manager, Social Media Manager, Human Resources Manager, and Broadcast Announcer or Radio DJ."]},{"t": "Perception and the Self in Communication","items": ["Perception is defined as the active process of selecting, organizing, and interpreting the people, objects, events, situations, and activities around us.","This process unfolds in three interrelated stages: Selection (deciding what we notice out of everything competing for our attention), Organization (fitting what we've noticed into mental categories, or schemata), and Interpretation (making sense of what we've organized, often by attributing causes or explanations to it).","Constructivist theory describes four types of schemata we use to organize experience: Prototypes, the clearest or most ideal example of a category; Personal Constructs, mental yardsticks that let us judge someone or something along a scale (for example, from \"kind\" to \"unkind\"); Stereotypes, predictive generalizations we make based on the category we place someone in; and Scripts, expected sequences of action that guide how we and others are supposed to behave in a given situation.","Attribution refers to the explanations we construct for other people's behavior. An Internal, or dispositional, attribution explains behavior in terms of a person's character or personal choices, while an External, or situational, attribution explains the same behavior in terms of the surrounding circumstances or environment.","Several factors shape how we perceive others and the world: Physiology (our individual sensory abilities and thresholds), Culture (as explored through Standpoint Theory, which holds that a single culture actually contains many social communities with differing levels of status and privilege), Social Roles (the expectations attached to the roles we're expected to fulfill), and Cognitive Abilities or Complexity (how many, and how abstractly, we use mental constructs to interpret situations).","Person-centered perception refers to the ability to perceive someone as a unique individual, drawing on abstract thinking and a wide range of schemata — but it is not the same thing as Empathy, which specifically involves recognizing another person's perspective and actively adjusting one's own communication in response to it.","The self does not exist in isolation — it arises through communication with others. Family plays a major early role in shaping identity through identity scripts (unspoken family rules about who we're supposed to be) and attachment styles (patterns of parenting — Secure, Fearful, or Dismissive — that teach us how to relate to others), while peers continue to shape the self later on through processes like social comparison."]}]},"css": {"name": "Contemporary Phil. Media","icon": "📺","color": "#DC2626","examType": "Identification, True or False, Multiple Choice","coverage": "Lessons 1–3 (Media Traditions & Print/Broadcast Media, Radio & TV & New Media, Media Effects)","exam": [{"q": "This media tradition refers to the tendency of media to support the dominant ideology of the ruling class.","opts": ["Acquiescence (Talima)","Revolutionary (Paglaban)","Sensationalism","Advocacy"],"a": 0,"k": "Identification"},{"q": "This media tradition is identified with the struggle for liberation from oppressors.","opts": ["Acquiescence","Revolutionary (Paglaban)","Community Press","National Press"],"a": 1,"k": "Identification"},{"q": "Which indie news outlet gives the perspective of people in Manila?","opts": ["Altermidya","Bulatlat","Radyo Migrante","Kodao"],"a": 1,"k": "Multiple Choice"},{"q": "Which indie news group focuses on Filipino migrants in Canada?","opts": ["Tudla","Radyo Migrante","Kodao","Altermidya"],"a": 1,"k": "Multiple Choice"},{"q": "Kodao is best described as:","opts": ["A national broadsheet","A multi-media production outfit documenting Filipinos' quest for social change","A government agency","A foreign wire service"],"a": 1,"k": "Multiple Choice"},{"q": "True or False: The National Press is based in Manila with nationwide circulation.","opts": ["True","False"],"a": 0,"k": "True or False"},{"q": "True or False: The Community Press is often criticized as a 'mouthpiece of politicians.'","opts": ["True","False"],"a": 0,"k": "True or False"},{"q": "This term describes newspapers that are huge in size, cost twice as much, and focus on politics and governance.","opts": ["Tabloids","Broadsheets","Magazines","Comics"],"a": 1,"k": "Identification"},{"q": "This term describes small-sized, cheaper newspapers mostly written in the native language.","opts": ["Broadsheets","Tabloids","Comics","Magazines"],"a": 1,"k": "Identification"},{"q": "According to the notes, how many national dailies are there?","opts": ["14","40","60","100"],"a": 1,"k": "Multiple Choice"},{"q": "How many regional/community newspapers are there, per the notes?","opts": ["14","40","60","80"],"a": 2,"k": "Multiple Choice"},{"q": "How many foreign newspapers are noted?","opts": ["14","40","60","20"],"a": 0,"k": "Multiple Choice"},{"q": "True or False: Newspapers are losing relevance as a source of information due to declining readership.","opts": ["True","False"],"a": 0,"k": "True or False"},{"q": "KZRH broadcasted the Fall of Bataan in 1942 through which segment?","opts": ["Voice of Freedom","Radyo Patrol","Radyo ng Bayan","Super Radyo"],"a": 0,"k": "Multiple Choice"},{"q": "This person anchored the 'Voice of Freedom' broadcast during the Fall of Bataan.","opts": ["Norman Reyes","Jaime Cardinal Sin","Johnny Midnight","Rey Langit"],"a": 0,"k": "Identification"},{"q": "Which Archbishop urged people to go to EDSA to support Enrile and Ramos via Radio Veritas?", ,"k": "Multiple Choice"},{"q": "Which is listed as an issue in broadcast media referring to politicians paying for exposure?","opts": ["Sensationalism","News-for-sale","Lack of new technology","Questionable role model"],"a": 1,"k": "Multiple Choice"},{"q": "True or False: The Philippines has the most violent TV shows among ASEAN countries, per the notes.","opts": ["True","False"],"a": 0,"k": "True or False"},{"q": "New media technology is largely based on:","opts": ["Print and radio waves","Computer-based digitalization, miniaturization, satellites, and fiber optics","Television only","Telegraph systems"],"a": 1,"k": "Multiple Choice"},{"q": "This ABS-CBN News Chief said, \"Our audience is overentertained, uninformed.\"","opts": ["Ging Reyes","Jaime Cardinal Sin","Norman Reyes","Johnny Midnight"],"a": 0,"k": "Identification"},{"q": "Which scholar warned that the field of media effects was 'withering away'?","opts": ["Lippmann","Berelson","Lasswell","Potter"],"a": 1,"k": "Multiple Choice"},{"q": "Lippmann (1922) suggested that mass communication could become:","opts": ["Irrelevant to society","The basis of people's view of the world","Purely entertainment","Obsolete"],"a": 1,"k": "Multiple Choice"},{"q": "Lasswell (1927) considered mass communication as a tool for:","opts": ["Entertainment only","Manipulation and social control","Education only","Art"],"a": 1,"k": "Multiple Choice"},{"q": "\"The Media is like the weather... it is always there,\" is a quote from:","opts": ["Berelson","Potter (1998)","Lippmann","Lasswell"],"a": 1,"k": "Multiple Choice"},{"q": "Media conglomerates acquire a variety of media outlets in order to create:","opts": ["Monopolies only","Synergy or cross-media spin-offs and promotion","Competition","Government control"],"a": 1,"k": "Multiple Choice"},{"q": "The Theoretical Reason for understanding media effects relates to:","opts": ["Funding opportunities","Not knowing the magnitude or inevitability of effects, despite acknowledging they occur","Government policy","Consulting income"],"a": 1,"k": "Multiple Choice"},{"q": "The Practical/Policy-oriented Reason for understanding media effects gives tools to:","opts": ["Journalists only","Parents, educators, and public officials to mitigate negative media effects","Advertisers only","Politicians only"],"a": 1,"k": "Multiple Choice"},{"q": "True or False: Media effects may be benign (helpful) as much as malign (harmful).","opts": ["True","False"],"a": 0,"k": "True or False"},{"q": "True or False: Media influence operates only through one single medium or text.","opts": ["True","False"],"a": 1,"k": "True or False"},{"q": "The Direct Effects model, also called the Hypodermic Needle Theory, proposes that media:","opts": ["Has no effect on the audience","Directly influences people, largely adversely, 'injecting' them with views and behaviors","Only affects children","Works through opinion leaders"],"a": 1,"k": "Multiple Choice"},{"q": "In Stuart Hall's Audience Reception model, which level completely rejects the media's idea?","opts": ["Dominant level","Negotiated level","Oppositional level","Direct level"],"a": 2,"k": "Multiple Choice"},{"q": "In Stuart Hall's model, the level where the audience accepts the message effectively/immediately ('accepts right away') is:","opts": ["Dominant level","Negotiated level","Oppositional level","Conditional level"],"a": 0,"k": "Multiple Choice"},{"q": "The Negotiated level in Stuart Hall's model means the audience:","opts": ["Rejects completely","Accepts but controlled, and can still reject parts","Has no reaction","Is directly injected with views"],"a": 1,"k": "Multiple Choice"},{"q": "The Conditional Effects model emphasizes:","opts": ["Uniform, direct impact on all audiences","Audience selectivity and social influence","Cumulative, repeated exposure","Agenda setting"],"a": 1,"k": "Multiple Choice"},{"q": "The Two-Step Flow Theory proposes that media influence is:","opts": ["Direct and immediate","Indirect, mediated through opinion leaders in social groups","Nonexistent","Only visual"],"a": 1,"k": "Multiple Choice"},{"q": "Cognitive Dissonance Theory explains that people experiencing conflicting beliefs will:","opts": ["Ignore all media","Try to lessen psychological discomfort by changing actions or beliefs","Become more logical","Stop communicating"],"a": 1,"k": "Multiple Choice"},{"q": "Uses and Gratifications Theory is based on questions such as:","opts": ["What does media do to people?","What do people do with media, and what do they use it for?","Who owns the media?","How is media regulated?"],"a": 1,"k": "Multiple Choice"},{"q": "The Cumulative Effects model explains media effects as a result of:","opts": ["A single powerful event","Cumulative exposure over time rather than a single event","Government policy","Advertising alone"],"a": 1,"k": "Multiple Choice"},{"q": "Agenda Setting Theory proposes that media influences:","opts": ["What people think","What topics people think about","Nothing at all","Only children's behavior"],"a": 1,"k": "Multiple Choice"},{"q": "Cultivation Theory suggests that repetitive media consumption:","opts": ["Has no lasting effect","Cumulatively cultivates certain attitudes and values","Only affects the elderly","Only applies to news media"],"a": 1,"k": "Multiple Choice"},{"q": "The Cognitive-Transactional Effect applies the notion of:","opts": ["Schematic processing to the media context","Direct injection of ideas","Agenda setting","Hypodermic needle theory"],"a": 0,"k": "Multiple Choice"},{"q": "True or False: Politicians who use media for re-election generally accept a view of strong media impact without question.","opts": ["True","False"],"a": 0,"k": "True or False"},{"q": "True or False: For academicians, media effects research offers no practical value or funding opportunities.","opts": ["True","False"],"a": 1,"k": "True or False"},{"q": "Media influence is more likely when the media text speaks of:","opts": ["Attitudes and values already held by the audience","Entirely new and foreign ideas","Government propaganda","Nothing in particular"],"a": 0,"k": "Multiple Choice"},{"q": "According to the notes, what people already believe may itself be:","opts": ["Unrelated to media","A product of prior media use","Purely genetic","Unchangeable"],"a": 1,"k": "Multiple Choice"},{"q": "People tend to use media material selectively to:","opts": ["Challenge their beliefs","Reinforce what they already believe","Become more open-minded","Avoid all media"],"a": 1,"k": "Multiple Choice"},{"q": "Which best describes a micro-level vs. macro-level distinction in media effects research?","opts": ["Individual audience member vs. societal/institutional/cultural level","AM vs FM radio","Broadsheet vs Tabloid","National vs Community press"],"a": 0,"k": "Multiple Choice"},{"q": "'Content dependent and content irrelevant effects' refers to effects that occur because of:","opts": ["Government regulation","A specific content or presentation format","Audience age","Radio frequency"],"a": 1,"k": "Multiple Choice"}],"flash": [["Acquiescence (Talima)","Media tendency to support the dominant ideology of the ruling class."],["Revolutionary (Paglaban)","Media identified with the struggle for liberation from oppressors."],["Broadsheet vs Tabloid","Broadsheet = large, pricier, politics-focused; Tabloid = small, cheap, native language."],["Voice of Freedom","KZRH's segment broadcasting the Fall of Bataan (1942), anchored by Norman Reyes."],["Radio Veritas & EDSA","Cardinal Sin used Radio Veritas to call people to EDSA in support of Enrile & Ramos."],["AM vs FM Radio","AM = news/public affairs/talk shows/soap opera; FM = music."],["News-for-Sale","Politicians paying for desired media exposure — a broadcast media ethics issue."],["Hypodermic Needle Theory","Media directly 'injects' views/behavior into a passive audience (Direct Effects)."],["Stuart Hall's Audience Reception","Dominant (accept), Negotiated (accept but can reject parts), Oppositional (reject completely)."],["Two-Step Flow Theory","Media influence is indirect, mediated through opinion leaders in social groups."],["Cognitive Dissonance Theory","People change beliefs/actions to resolve the discomfort of conflicting beliefs."],["Uses and Gratifications Theory","Focuses on what people do WITH media, not what media does to them."],["Cumulative Effects Model","Media effects build up from repeated exposure, not a single event."],["Agenda Setting Theory","Media doesn't tell us what to think, but what to think ABOUT."],["Cultivation Theory","Repetitive media consumption cultivates certain attitudes/values over time."],["Lippmann (1922)","Mass communication could become the basis of people's view of the world."],["Lasswell (1927)","Considered mass communication a tool for manipulation and social control."],["Berelson (1959)","Warned the field of media effects was 'withering away.'"]],"notes": [{"t": "Lesson 1: Traditions & Print Media","items": ["Philippine media has historically followed two competing traditions: Acquiescence, or Talima, in which media outlets tend to support the ideology of the ruling class, and the Revolutionary tradition, or Paglaban, in which media is used as a tool in the struggle for liberation from oppressors.","Several independent (\"indie\") news outlets operate outside the mainstream press: Bulatlat offers perspectives from ordinary people in Manila, Altermidya positions itself as an independent, progressive alternative news network, Radyo Migrante focuses on Filipino migrants in Canada, Tudla documents the experiences of marginalized groups through film, and Kodao is a multi-media production outfit dedicated to documenting Filipinos' pursuit of social change.","The Philippine press operates through two roughly parallel systems: the National Press, which is based in Manila and circulates nationwide, and the Community Press, sometimes called the \"poor cousins\" of the national outlets — smaller, local, and sometimes criticized as being little more than a mouthpiece for local politicians, though steadily growing in number.","In print media, Broadsheets are large-format, more expensive newspapers that focus on politics and governance, while Tabloids are smaller, cheaper newspapers usually written in the native language and aimed at a mass readership. Nationally, there are 40 national dailies, roughly 60 regional or community newspapers, and 14 foreign newspapers circulating in the country.","The print media sector continues to face several challenges, including steadily declining readership, the ongoing shift toward online and mobile platforms, instances of media corruption, a broader culture of impunity surrounding attacks on journalists, and generally weaker reportage within the community press."]},{"t": "Lesson 2: Radio, Television & New Media","items": ["Philippine radio has played a dramatic role in national history — KZRH's \"Voice of Freedom\" segment, anchored by Norman Reyes, broadcast news of the Fall of Bataan in 1942, while decades later, Radio Veritas carried Jaime Cardinal Sin's call for people to gather at EDSA in support of Enrile and Ramos during the 1986 revolution.","Other notable radio programs include Rey Langit, which featured telephone conversations connecting overseas Filipino workers with their families back home, and Johnny Midnight, a program known for its host's midnight healing techniques, speaking in tongues, and incantations.","The country has around 1,500 radio stations in total, made up of 416 AM stations (which focus mainly on news, public affairs, talk shows, and soap operas) and 1,042 FM stations (which focus mainly on music). Just four stations — DZMM Radyo Patrol, DZBB Super Radyo, Radyo ng Bayan, and DZRH — together command a combined 84% share of the radio audience.","Television remains the most used and most trusted source of political information, trusted by 58% of the population, with the average consumer watching about 4.9 hours of television per week. Nationwide there are 437 TV stations, of which 23 are based in Metro Manila.","Broadcast media in the Philippines continues to grapple with several ethical issues, including \"news-for-sale\" arrangements in which politicians pay for favorable coverage, sensationalism, a lag in adopting new technology, and concerns over being a questionable role model for youth, given that the country has been noted for having some of the most violent television programming among ASEAN nations.","New Media refers to the wave of computer-based communication technology built on digitalization, miniaturization, satellite systems, and fiber optics, which has fundamentally transformed how information is exchanged, processed, stored, and retrieved."]},{"t": "Lesson 3: Media Effects","items": ["Scholarly views on media's power have shifted over time: Berelson (1959) warned that the field of media effects research seemed to be \"withering away\"; Lippmann (1922) suggested even earlier that mass communication could become the very basis of how people understand and picture the world; and Lasswell (1927) went further, treating mass communication as a tool that could be used for manipulation and social control.","Media conglomerates often acquire a wide variety of media outlets in order to create synergy — enabling cross-media promotion and spin-offs across their properties — while politicians, for their part, tend to readily accept the premise of strong media impact when it comes to securing re-election.","There are two main reasons scholars continue to study media effects: a Theoretical reason, since researchers still don't fully know the true magnitude or inevitability of media's effects even though they broadly agree such effects exist, and a Practical or Policy-oriented reason, since this research gives parents, educators, and public officials concrete tools to help mitigate any negative effects of media exposure.","Several key principles emerge from media effects research: media's influence tends to be stronger when a message matches attitudes people already hold; media effects can be just as easily benign (helpful) as malign (harmful); influence typically comes from a collective mix of media sources rather than any single medium or text; the impact of media is always conditioned by personal and social factors unique to each audience member; what people already believe may itself be partly a product of earlier media exposure; and people tend to seek out and use media selectively in ways that reinforce beliefs they already hold.","Several theoretical models describe how media exerts influence: the Direct Effects, or Hypodermic Needle, model imagines media as directly \"injecting\" views and behaviors into an essentially passive audience; Stuart Hall's Audience Reception model instead identifies three distinct audience responses — the Dominant level (accepting the message as intended), the Negotiated level (accepting the message but reserving the right to reject certain parts), and the Oppositional level (rejecting the intended message outright); the Conditional Effects, or Two-Step Flow, model argues that media influence is typically indirect, filtered through opinion leaders within social groups; Cognitive Dissonance Theory explains how people adjust their beliefs or actions to relieve the discomfort of holding conflicting ideas; Uses and Gratifications Theory shifts the question from what media does to people toward what people actively do with media and what needs it satisfies for them; the Cumulative Effects model attributes media's influence to repeated exposure building up over time rather than any single powerful message; Agenda Setting Theory (closely related to Cultivation Theory) argues that media may not tell us exactly what to think, but strongly shapes what topics we think about and, over time, cultivates broader attitudes and values; and the Cognitive-Transactional Effect applies the general idea of schematic processing — the mental shortcuts we use to interpret information — specifically to how audiences process media content."]}]}}</script>
<script>
const DATA = JSON.parse(document.getElementById('subject-data').textContent);
const app = document.getElementById('app');

let state = { view: 'home', subject: null, tab: 'notes', noteLessonIdx: 0, quizMode: null, quizIdx:0, quizAnswers:[], quizPicked:null, flashIdx:0, flashFlipped:false };

function shuffle(arr, seed){
  // simple stable shuffle so quiz order is fixed per load but varied
  let a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

function getQuizSet(subj, mode){
  const exam = DATA[subj].exam;
  if(mode === 'exam') return exam;
  // 30-item quiz: pick every other question for spread coverage
  const picked = exam.filter((_,i)=> i % 2 === 0);
  return picked;
}

function render(){
  if(state.view === 'home') return renderHome();
  if(state.view === 'subject') return renderSubject();
}

function renderHome(){
  const total = Object.keys(DATA).length;
  app.innerHTML = `
    <div class="topbar">
      <div class="brand"><span class="dot"></span> Ayuq na Mag-aral hohuhuo</div>
      <div class="pill">Midterm Review</div>
    </div>
    <div class="hero">
      <h1>Ready for your midterms?</h1>
      <p>Pick a subject to review — each one comes with Notes, Flashcards, a 30-item Quiz, and a 60-item Exam, all built from your own notes.</p>
      <div class="hero-stats">
        <div>${total}<span>Subjects</span></div>
        <div>300<span>Exam Questions</span></div>
        <div>150<span>Quiz Questions</span></div>
      </div>
    </div>
    <div class="section-title">Your Subjects</div>
    <div class="grid" id="grid"></div>
    <footer>Built from your own notes · Good luck on your midterms!</footer>
  `;
  const grid = document.getElementById('grid');
  Object.keys(DATA).forEach(key=>{
    const s = DATA[key];
    const card = document.createElement('div');
    card.className = 'card';
    card.onclick = ()=>{ state.view='subject'; state.subject=key; state.tab='notes'; state.noteLessonIdx=0; render(); window.scrollTo(0,0); };
    card.innerHTML = `
      <div class="icon" style="background:${s.color}1A;color:${s.color}">${s.icon}</div>
      <h3>${s.name}</h3>
      <div class="meta">${s.coverage}</div>
      <div class="badges">
        <span class="badge">${s.examType}</span>
      </div>
    `;
    grid.appendChild(card);
  });
}

function renderSubject(){
  const s = DATA[state.subject];
  app.innerHTML = `
    <div class="back-btn" id="backBtn">← Back to subjects</div>
    <div class="subject-head">
      <div class="icon" style="background:${s.color}1A;color:${s.color}">${s.icon}</div>
      <div>
        <h2>${s.name}</h2>
        <div class="sub">${s.examType} · ${s.coverage}</div>
      </div>
    </div>
    <div class="tabs" id="tabs">
      <div class="tab" data-tab="notes">Notes</div>
      <div class="tab" data-tab="flash">Flashcards</div>
      <div class="tab" data-tab="quiz">Quiz (30)</div>
      <div class="tab" data-tab="exam">Exam (60)</div>
    </div>
    <div class="panel" id="panel"></div>
  `;
  document.getElementById('backBtn').onclick = ()=>{ state.view='home'; render(); window.scrollTo(0,0); };
  document.querySelectorAll('.tab').forEach(t=>{
    if(t.dataset.tab === state.tab) t.classList.add('active');
    t.onclick = ()=>{
      state.tab = t.dataset.tab;
      state.quizMode = null; state.flashIdx=0; state.flashFlipped=false; state.noteLessonIdx=0;
      renderSubject();
    };
  });
  const panel = document.getElementById('panel');
  if(state.tab === 'notes') renderNotes(panel, s);
  else if(state.tab === 'flash') renderFlash(panel, s);
  else if(state.tab === 'quiz') renderQuizStart(panel, 'quiz');
  else if(state.tab === 'exam') renderQuizStart(panel, 'exam');
}

/* ---------- NOTES ---------- */
function renderNotes(panel, s){
  const lessons = s.notes;
  const hasEssay = !!s.essay;
  const totalPages = lessons.length + (hasEssay ? 1 : 0);
  const idx = Math.min(state.noteLessonIdx, totalPages - 1);
  const isEssayPage = hasEssay && idx === lessons.length;

  const pills = lessons.map((block, i)=>`<div class="tab lesson-pill ${i===idx?'active':''}" data-idx="${i}">${block.t}</div>`).join('')
    + (hasEssay ? `<div class="tab lesson-pill ${isEssayPage?'active':''}" data-idx="${lessons.length}">Essay Practice Prompts</div>` : '');

  let body = '';
  if(isEssayPage){
    body = `<div class="essay-box" style="margin-top:0;"><h4>Essay Practice Prompts</h4><ol>${s.essay.map(e=>`<li>${e}</li>`).join('')}</ol></div>`;
  } else {
    const block = lessons[idx];
    body = `<div class="note-block" style="margin-bottom:0;"><h4>${block.t}</h4><ul>${block.items.map(i=>`<li>${i}</li>`).join('')}</ul></div>`;
  }

  panel.innerHTML = `
    <div class="tabs lesson-tabs" id="lessonTabs">${pills}</div>
    ${body}
    <div class="flash-nav" style="margin-top:16px;">
      <button class="nav-btn secondary" id="notePrev" ${idx===0?'disabled':''}>← Previous Lesson</button>
      <button class="nav-btn" id="noteNext" ${idx===totalPages-1?'disabled':''}>Next Lesson →</button>
    </div>
  `;
  document.querySelectorAll('.lesson-pill').forEach(p=>{
    p.onclick = ()=>{ state.noteLessonIdx = parseInt(p.dataset.idx); renderNotes(panel, s); };
  });
  document.getElementById('notePrev').onclick = ()=>{ state.noteLessonIdx = idx - 1; renderNotes(panel, s); };
  document.getElementById('noteNext').onclick = ()=>{ state.noteLessonIdx = idx + 1; renderNotes(panel, s); };
}

/* ---------- FLASHCARDS ---------- */
function renderFlash(panel, s){
  const cards = s.flash;
  const i = state.flashIdx;
  const c = cards[i];
  panel.innerHTML = `
    <div class="flash-wrap">
      <div class="flash-counter">Card ${i+1} of ${cards.length} · Read the description, then reveal the term</div>
      <div class="flashcard ${state.flashFlipped?'flipped':''}" id="fc">
        <div class="flashcard-inner">
          <div class="flashcard-face front">${c[1]}</div>
          <div class="flashcard-face back">${c[0]}</div>
        </div>
      </div>
      <button class="nav-btn" id="revealBtn" style="width:100%;max-width:460px;">${state.flashFlipped ? 'Back to Description' : 'Reveal Answer'}</button>
      <div class="flash-nav">
        <button class="nav-btn secondary" id="prevBtn" ${i===0?'disabled':''}>← Prev</button>
        <button class="nav-btn secondary" id="shuffleBtn">Shuffle</button>
        <button class="nav-btn secondary" id="nextBtn" ${i===cards.length-1?'disabled':''}>Next →</button>
      </div>
    </div>
  `;
  document.getElementById('fc').onclick = ()=>{ state.flashFlipped = !state.flashFlipped; renderFlash(panel, s); };
  document.getElementById('revealBtn').onclick = (e)=>{ e.stopPropagation(); state.flashFlipped = !state.flashFlipped; renderFlash(panel, s); };
  document.getElementById('prevBtn').onclick = (e)=>{ e.stopPropagation(); state.flashIdx--; state.flashFlipped=false; renderFlash(panel,s); };
  document.getElementById('nextBtn').onclick = (e)=>{ e.stopPropagation(); state.flashIdx++; state.flashFlipped=false; renderFlash(panel,s); };
  document.getElementById('shuffleBtn').onclick = (e)=>{ e.stopPropagation(); s.flash = shuffle(s.flash); state.flashIdx=0; state.flashFlipped=false; renderFlash(panel,s); };
}

/* ---------- QUIZ / EXAM ---------- */
function renderQuizStart(panel, mode){
  const label = mode==='quiz' ? '30-Item Quiz' : '60-Item Exam';
  const desc = mode==='quiz' ? 'A quick practice quiz so you can check what you already know.' : 'A full exam simulation — the same length as your actual exam.';
  panel.innerHTML = `
    <div class="start-box">
      <h3 style="font-size:20px;">${label}</h3>
      <p>${desc}</p>
      <div class="btn-row">
        <button class="big-btn" id="startBtn">Start</button>
      </div>
    </div>
  `;
  document.getElementById('startBtn').onclick = ()=>{
    const set = shuffle(getQuizSet(state.subject, mode));
    state.quizMode = mode;
    state.quizSet = set;
    state.quizIdx = 0;
    state.quizAnswers = [];
    state.quizPicked = null;
    renderQuizQuestion(panel);
  };
}

function renderQuizQuestion(panel){
  const set = state.quizSet;
  const idx = state.quizIdx;
  if(idx >= set.length) return renderQuizResult(panel);
  const item = set[idx];
  const letters = ['A','B','C','D'];
  const pct = Math.round((idx/set.length)*100);
  panel.innerHTML = `
    <div class="quiz-top">
      <span class="q-count">${idx+1} / ${set.length}</span>
      <div class="quiz-bar"><div class="quiz-bar-fill" style="width:${pct}%"></div></div>
      <span class="q-count" id="scoreLive">Score: ${state.quizAnswers.filter(a=>a.correct).length}</span>
    </div>
    <div class="q-type">${item.k || 'Multiple Choice'}</div>
    <div class="q-text">${item.q}</div>
    <div class="options" id="opts">
      ${item.opts.map((o,i)=>`<div class="option" data-i="${i}"><span class="letter">${letters[i]||i+1}</span><span>${o}</span></div>`).join('')}
    </div>
    <div class="quiz-actions"><button class="nav-btn" id="nextQ" style="display:none;">Next →</button></div>
  `;
  const opts = document.querySelectorAll('.option');
  opts.forEach(opt=>{
    opt.onclick = ()=>{
      if(state.quizPicked !== null) return;
      const picked = parseInt(opt.dataset.i);
      state.quizPicked = picked;
      const correct = picked === item.a;
      state.quizAnswers.push({ q:item.q, opts:item.opts, picked, correct, correctIdx:item.a });
      opts.forEach(o=>{
        o.classList.add('disabled');
        const oi = parseInt(o.dataset.i);
        if(oi === item.a) o.classList.add('correct');
        else if(oi === picked) o.classList.add('wrong');
      });
      document.getElementById('scoreLive').textContent = 'Score: ' + state.quizAnswers.filter(a=>a.correct).length;
      const nextBtn = document.getElementById('nextQ');
      nextBtn.style.display = 'inline-block';
      nextBtn.textContent = (idx+1 >= set.length) ? 'See Results →' : 'Next →';
      nextBtn.onclick = ()=>{ state.quizIdx++; state.quizPicked=null; renderQuizQuestion(panel); };
    };
  });
}

function renderQuizResult(panel){
  const answers = state.quizAnswers;
  const score = answers.filter(a=>a.correct).length;
  const total = answers.length;
  const pct = Math.round((score/total)*100);
  let msg = "Keep reviewing — you'll get there!";
  if(pct >= 90) msg = "Outstanding! You're ready.";
  else if(pct >= 75) msg = "Solid! Just a bit more review.";
  else if(pct >= 50) msg = "Good start — go back over the topics you missed.";
  panel.innerHTML = `
    <div class="result-wrap">
      <div class="result-score">${score}/${total}</div>
      <div class="result-label">${pct}% correct</div>
      <div class="result-msg">${msg}</div>
      <div class="btn-row" style="margin-top:22px;">
        <button class="big-btn" id="retryBtn">Try Again</button>
        <button class="big-btn ghost" id="reviewBtn">Review Answers</button>
      </div>
      <div class="review-list" id="reviewList" style="display:none;"></div>
    </div>
  `;
  document.getElementById('retryBtn').onclick = ()=> renderQuizStart(panel, state.quizMode);
  document.getElementById('reviewBtn').onclick = (e)=>{
    const rl = document.getElementById('reviewList');
    if(rl.style.display === 'none'){
      rl.style.display = 'block';
      rl.innerHTML = answers.map(a=>`
        <div class="review-item ${a.correct?'ok':'bad'}">
          <div class="rq">${a.q}</div>
          <div class="ra">Your answer: ${a.opts[a.picked]} ${a.correct?'':`— <b>Correct: ${a.opts[a.correctIdx]}</b>`}</div>
        </div>
      `).join('');
      e.target.textContent = 'Hide Review';
    } else {
      rl.style.display = 'none';
      e.target.textContent = 'Review Answers';
    }
  };
}

render();
</script>
</body>
